function qInit(){
  if(!player.quests) player.quests={};
  for(const id of ['kingslayer','lightbringer','descent','giantslayer']) // CHAPTERS: ch1 grants; later chapters grant on unlock
    if(!player.quests[id]) player.quests[id]={n:0,st:0,done:false,data:{}};
  if(player.fennDisc==null) player.fennDisc=0;
  chBackfill(); // CHAPTERS: derive chapter state on old saves
}
function qGrant(id,data){
  qInit();
  if(player.quests[id]&&!player.quests[id].done) return false; // already active
  player.quests[id]={n:0,st:0,done:false,data:data||{}};
  saveGame(); return true;
}
function qProg(id,n){
  const q=player.quests&&player.quests[id]; if(!q||q.done) return;
  const def=qDef(id);
  if(def.kind==='main'&&!chQuestLive(id)) return; // CHAPTERS: gated until chapter unlocks
  q.n+=n;
  const need=def.need||(def.stages?def.stages.length:1);
  if(q.n>=need){ qComplete(id); } else saveGame();
}
function qStage(id){ // advance one stage of a staged quest; returns true if quest finished
  const q=player.quests[id]; if(!q||q.done) return false;
  const def=qDef(id);
  qRewardStage(id,q.st); q.st++;
  if(q.st>=def.stages.length){ q.done=true; qCompleteFx(id); }
  saveGame(); return q.done;
}
function qEvent(t,d){
  if(!player.quests) return; d=d||{};
  mpAchEvent(t,d); // META-POLISH 2026-10-07
  if(t==='depth'){ // THE DESCENT stages (CHAPTERS: stage s needs chapter s unlocked)
    const q=player.quests.descent; if(q&&!q.done){
      const def=qDef('descent'), cur=chapState().cur;
      while(q.st<def.stages.length&&d.d>=def.stages[q.st].d&&q.st<=cur){ qStage('descent'); }
    }
    if(d.d===1&&!chapState().intro1){ // CHAPTERS: CH I intro on first descent
      chapState().intro1=true; saveGame();
      const tryIntro=()=>{ if(typeof state!=='undefined'&&state==='map') chBeat({t:'intro',C:CHAPTERS[0]});
        else setTimeout(tryIntro,2000); };
      setTimeout(tryIntro,1500);
    }
  } else if(t==='boss'){
    if(d.type==='king') qKillQuest('kingslayer');
    else if(['vhexul','corvex','nul'].includes(d.type)){
      const q=player.quests.giantslayer;
      if(q&&!q.done){ const def=qDef('giantslayer'); const si=def.stages.findIndex(s=>s.t===d.type);
        if(si>=0&&si===q.st){ qRewardStage('giantslayer',si); q.st++;
          if(q.st>=def.stages.length){ q.done=true; qCompleteFx('giantslayer'); } saveGame(); } }
      if(activeComps().some(m=>m.key==='dunric')) qProg('comp_dunric',1);
    }
  } else if(t==='kill'){
    qProg('exterminator',1);
    const su=player.quests.spirit_ub;
    if(su&&!su.done&&d.type===su.data.target) qProg('spirit_ub',1);
    if(performance.now()-(player._spellT||0)<4000) qProg('comp_issa',1);
  } else if(t==='chest'){
    qProg('delver',1); qProg('comp_pell',1);
  } else if(t==='torch'){ qProg('lightbringer',1); }
  chCheck(); // CHAPTERS: unlock flow after any quest event
}
function qKillQuest(id){ const q=player.quests[id]; if(q&&!q.done){ q.n=1; qComplete(id); } }
function qRewardStage(id,si){
  const d=player.depth;
  const give=(it)=>{ if(it){ addItem(it); toast('Reward: '+it.name); } };
  if(id==='descent'){
    if(si===0){ player.gold+=50; toast('+50 gold — depth pay. Spend it on staying alive.'); }
    else if(si===1){ player.talentPts++; toast('+1 TALENT POINT — the deep teaches harsh lessons. Spend it in the TALENTS tab.'); AU.levelup(); }
    else if(si===2){ give(genLoot(d,'rare','charm')); }
    else { player.gold+=300; give(genLoot(d,'rare','lantern')); toast('+300 gold. You are officially too deep to quit.'); }
  } else if(id==='kingslayer'){ player.gold+=100; give(genLoot(d,'relic','charm')); }
  else if(id==='giantslayer'){ player.gold+=150; give(genLoot(d,'relic','charm')); }
  else if(id==='lightbringer'){ player.talentPts++; player.gold+=80; toast('+1 TALENT POINT, +80 gold. Bearer of the flame. Try not to burn the eyebrows off.'); AU.levelup(); }
  else if(id==='exterminator'){ give(genLoot(d,'rare','weapon')); }
  else if(id==='delver'){ player.gold+=120; addItem('emberheart',1); toast('+120 gold and an Emberheart. Professional looter.'); }
  else if(id==='fenn_supply'){
    const rep=(player.quests.fenn_supply.data.rep||0);
    player.fennDisc=Math.min(0.25,(player.fennDisc||0)+0.05);
    give(genLoot(d,'rare')); player.gold+=60+rep*20;
  } else if(id==='spirit_ub'){
    const owned=player.traits||[];
    const unowned=Object.keys(TRAITS).filter(k=>!owned.includes(k));
    if(unowned.length){ const tk=unowned[(Math.random()*unowned.length)|0]; player.traits.push(tk);
      toast('Trait gained: '+TRAITS[tk].name+' — a dead thing\'s gratitude. Weird. Useful.'); }
    else { player.talentPts++; toast('+1 TALENT POINT. The spirit had nothing left but lessons.'); }
    AU.levelup();
  } else if(id==='comp_dunric'){ const m=party.find(c=>c.key==='dunric'); if(m) bondGain(m,30); give(genLoot(d,'relic','garb')); }
  else if(id==='comp_issa'){ const m=party.find(c=>c.key==='issa'); if(m) bondGain(m,30); give(genLoot(d,'relic','weapon')); }
  else if(id==='comp_pell'){ const m=party.find(c=>c.key==='pell'); if(m) bondGain(m,30); give(genLoot(d,'relic','weapon')); }
}
function qComplete(id){
  const q=player.quests[id]; if(!q||q.done) return;

function qProgText(id){

/* ================= QUEST CHAPTERS (added 2026-10-07) =================
   The main questline as a 4-chapter story journey. Chapters unlock in order;
   a chapter's quests are granted on unlock. Boss kills always count (unique
   story beats — no soft-locks); descent stages are chapter-gated with catch-up
   on unlock. Side quests are always live. State: player.chap (persisted). */
const CHAPTERS=[
 {id:'ch1',num:'I',name:'FRESH MEAT',depths:'DEPTHS 1–3',

  intro:"Fresh meat. That is what the dark calls you, and the dark is never wrong. Here is the job: go down, light what you can, and unmake the Barrow King. He has been squatting on that throne since before your grandfather was a disappointment. Try not to die. Dying is for other people.",
  outro:"The King is dead and you are not. That puts you ahead of nine out of ten bastards who try this. Enjoy it while it lasts. It gets worse from here. It always gets worse.",
  quests:['kingslayer','lightbringer'],dStage:0},
 {id:'ch2',num:'II',name:'THE MAW',depths:'DEPTHS 4–7',

  outro:"Vhexul is paste and the halls went quiet. Too quiet. That is the sound of something bigger hearing you coming. Deeper, meat. The Hollow is waiting, and it is not patient.",
  quests:['exterminator'],dStage:1,gStage:0},
 {id:'ch3',num:'III',name:'THE HOLLOW',depths:'DEPTHS 8–11',

  intro:"Welcome to the Hollow, where the dark has opinions. Corvex nests here — two heads, no manners, all teeth. Crack every chest you find; the dead rich are the best rich. Keep descending. The bottom has a name, and it already knows yours.",

  quests:['delver'],dStage:2,gStage:1},
 {id:'ch4',num:'IV',name:'THE UNMAKING',depths:'DEPTH 12+',
  flavor:'The last chapter. The dark saved its best monster for last.',
  intro:"This is it. The Unmaking. Nul — the thing the other monsters have nightmares about. Kill it and you are not a legend. Legends are for people who stop. You keep going down. That is worse. That is better. Go.",
  outro:"Nul is unmade. The depths are infinite, and so, apparently, are you. Rest if you want. The dark will wait. It is very, very good at waiting.",
  quests:[],dStage:3,gStage:2},

function chapState(){ if(!player.chap) player.chap={cur:0,done:[false,false,false,false],seen:false,view:null,intro1:false}; return player.chap; }
function chComplete(ci){
  const C=CHAPTERS[ci]; if(!C) return false;
  for(const id of C.quests){ const q=player.quests&&player.quests[id]; if(!q||!q.done) return false; }
  const dq=player.quests&&player.quests.descent; if(!dq||dq.st<=C.dStage) return false;
  if(C.gStage!=null){ const gq=player.quests&&player.quests.giantslayer; if(!gq||gq.st<=C.gStage) return false; }
  return true;
}
function chGrant(ci){
  const C=CHAPTERS[ci]; if(!C) return;
  for(const id of C.quests) if(!player.quests[id]) player.quests[id]={n:0,st:0,done:false,data:{}};
  saveGame();
}
function chBackfill(){ // derive chapter state on old saves; no-op once seen
  const ch=chapState(); if(ch.seen) return; ch.seen=true;
  let cur=0;
  for(let ci=0;ci<CHAPTERS.length;ci++){ if(chComplete(ci)){ ch.done[ci]=true; cur=ci+1; } else break; }
  ch.cur=Math.min(cur,CHAPTERS.length);
  ch.intro1=true; // old saves: don't replay the CH I intro
  for(let ci=0;ci<=ch.cur;ci++) chGrant(ci);
  saveGame();
}
function chQuestLive(id){ // main quests only progress once their chapter unlocks
  const ch=chapState();
  for(let ci=0;ci<=ch.cur&&ci<CHAPTERS.length;ci++) if(CHAPTERS[ci].quests.includes(id)) return true;
  return false;
}
let _chBusy=false;
function chCheck(){
  if(_chBusy) return;
  _chBusy=true;
  let unlocked=false; const beats=[];
  try{
    const ch=chapState();
    while(ch.cur<CHAPTERS.length&&chComplete(ch.cur)){
      const ci=ch.cur, C=CHAPTERS[ci];
      ch.done[ci]=true; ch.cur++; unlocked=true;
      mpAchEvent('chapter',{i:ci}); // META-POLISH 2026-10-07
      beats.push({t:'outro',C});
      if(ch.cur<CHAPTERS.length){ chGrant(ch.cur); beats.push({t:'intro',C:CHAPTERS[ch.cur]}); }
      else beats.push({t:'finale'});
    }
    if(ch.done[1]) diffUnlock(3); // DIFFICULTY 2026-10-07: NIGHTMARE unlocks on CH II (slay Vhexul)
    if(unlocked) saveGame();
  }finally{ _chBusy=false; }
  if(unlocked) chCatchup();
  if(beats.length) setTimeout(()=>{ for(const b of beats) chBeat(b); },900);
}
function chCatchup(){ // re-run depth-gated progress after unlocks
  const q=player.quests&&player.quests.descent;
  if(q&&!q.done){
    const def=qDef('descent'), cur=chapState().cur; let adv=false;
    while(q.st<def.stages.length&&player.depth>=def.stages[q.st].d&&q.st<=cur){ qStage('descent'); adv=true; }
    if(adv) chCheck();
  }
}
function chBeat(b){
  if(b.t==='outro'){ toast('CHAPTER COMPLETE: CH '+b.C.num+' — '+b.C.name); say('THE WASTES',b.C.outro); }
  else if(b.t==='intro'){ AU.levelup(); toast('— CH '+b.C.num+' — '+b.C.name+' —'); dmgNum(player.x,player.y-40,'CH '+b.C.num,'#ffd76a'); say('THE WASTES',b.C.intro); }
  else { AU.levelup(); toast('THE UNMAKING IS DONE'); say('THE WASTES',CHAPTERS[3].outro); player.ngReady=true; saveGame(); // ENDGAME-CONTENT 2026-10-07: NG+ unlocked
    setTimeout(()=>{ if(player.ngReady) toast('NEW GAME+ UNLOCKED — open PAUSE to begin cycle '+((player.ng||0)+2)); },4500);
    mpVictory(); } // META-POLISH 2026-10-07
}
function chQuestRows(ci){ // row data for the viewed chapter: [nameHTML, desc]
  const C=CHAPTERS[ci], rows=[], q=player.quests||{};
  for(const id of C.quests){
    const qq=q[id], def=qDef(id); if(!qq||!def) continue;
    rows.push(['<span style="color:'+(qq.done?'#5a6a4a':'#ffd76a')+'">'+def.name+'</span>',
      def.desc+'<br><span style="color:#c9a86a">'+qProgText(id)+'</span>']);
  }
  const dq=q.descent, dd=qDef('descent');
  if(dq&&dd){ const s=dd.stages[C.dStage];
    const dst=dq.st>C.dStage?'DONE':(dq.st===C.dStage?'IN PROGRESS':'—');
    rows.push(['<span style="color:#ffd76a">THE DESCENT</span> <span style="color:#8a7a63">[stage '+(C.dStage+1)+'/4]</span>',
      'Go down. That is the whole job.<br><span style="color:#c9a86a">'+s.txt+' — '+dst+'</span>']); }
  if(C.gStage!=null){ const gq=q.giantslayer, gd=qDef('giantslayer');
    if(gq&&gd){ const s=gd.stages[C.gStage];
      const gst=gq.st>C.gStage?'DONE':(gq.st===C.gStage?'IN PROGRESS':'—');
      rows.push(['<span style="color:#ffd76a">GIANTSLAYER</span> <span style="color:#8a7a63">[stage '+(C.gStage+1)+'/3]</span>',
        gd.desc+'<br><span style="color:#c9a86a">'+s.txt+' — '+gst+'</span>']); } }
  return rows;
}

/* ================= UI-ACCESS (2026-10-07) =================
   1. Easy close: big DONE, tap-outside-to-close, back-key closes overlays.
   2. Menu scrolling: .scrollY + scroll cues (touch-action:pan-y).
   3. Quest-log quick button (QST beside BAG).
   4. Custom button layout: drag to reposition, fractions persisted.
   5. UI MODE presets: DEFAULT / MINIMAL / CUSTOM. Minimap exempt (own toggle). */

// ---- 1a. big DONE + tap-outside-to-close ----
document.getElementById('btnSetBack').classList.add('bigdone');
function tapOutsideClose(el, fn){
  let sx=0, sy=0, down=false;
  el.addEventListener('pointerdown',e=>{ down=true; sx=e.clientX; sy=e.clientY; });
  el.addEventListener('pointerup',e=>{
    if(!down) return; down=false;
    if(e.target!==el) return;
    if(Math.hypot(e.clientX-sx,e.clientY-sy)<14) fn();
  });
}
tapOutsideClose(document.getElementById('settingsUI'),()=>document.getElementById('btnSetBack').click());
tapOutsideClose(document.getElementById('pauseUI'),()=>{ if(!settingsOpen&&paused) setPaused(false); });
tapOutsideClose(document.getElementById('invUI'),()=>{ if(state==='inv') setState('map'); });
tapOutsideClose(document.getElementById('shopUI'),()=>{ if(state==='shop') setState('map'); });
tapOutsideClose(document.getElementById('campUI'),()=>{ if(state==='camp') setState('map'); });
// 1b. (back-key for inv/shop/camp/choice is handled at the primary keydown
// handler above with stopImmediatePropagation so the pause toggle can't race it)

// ---- 2. scroll cues ----
function watchScroll(el){
  if(!el) return;
  const cue=el.parentElement.querySelector(':scope > .scue'); if(!cue) return;
  const upd=()=>{ let can=false, atEnd=true;
    try{ can=el.scrollHeight>el.clientHeight+4; atEnd=el.scrollTop+el.clientHeight>=el.scrollHeight-8; }catch(err){}
    cue.style.display=(can&&!atEnd)?'block':'none'; };
  el.addEventListener('scroll',upd,{passive:true});
  if(window.MutationObserver) new MutationObserver(upd).observe(el,{childList:true,subtree:true,characterData:true});
  upd();
}
['invBody','shopBuy','shopSell','campBody','setRows'].forEach(id=>watchScroll(document.getElementById(id)));

// ---- 3. quest-log quick button ----

document.getElementById('questBtn').addEventListener('pointerdown',e=>{ e.stopPropagation(); if(state==='map') openQuestLog(); });

// ---- 4. custom button layout ----
const DRAG_IDS=['dpad','btnAtk','btnSpell1','btnSpell2','btnDodge','btnPotion','btnRng','bagBtn','questBtn','muteBtn','pauseBtn'];
let moveMode=false, dragEl=null, dragOX=0, dragOY=0;
function getLayout(){ try{ return JSON.parse(localStorage.getItem('toodark_layout')||'{}'); }catch(e){ return {}; } }
function saveLayout(l){ try{ localStorage.setItem('toodark_layout',JSON.stringify(l)); }catch(e){} }
function layoutHasCustom(){ const p=(getLayout().pos||{}); return DRAG_IDS.some(id=>p[id]); }
function setElPos(el,nx,ny){ // nx,ny in #controls coords; ancestors' offsets are static
  const ctl=document.getElementById('controls');
  let ox=0, oy=0, p=el.offsetParent;
  while(p&&p!==ctl){ ox+=p.offsetLeft||0; oy+=p.offsetTop||0; p=p.offsetParent; }
  el.style.left=(nx-ox)+'px';
  el.style.top=(ny-oy)+'px';
  el.style.right='auto'; el.style.bottom='auto'; el.style.transform='none';
}
function applyLayout(){
  const ctlEl=document.getElementById('controls');
  const ctl=ctlEl.getBoundingClientRect();
  if(ctl.width<2) return;
  const pos=getLayout().pos||{};
  for(const id of DRAG_IDS){ const el=document.getElementById(id); if(!el||!el.offsetParent) continue; // skip hidden
    const p=pos[id];
    if(p){ setElPos(el,p.fx*ctl.width,p.fy*ctl.height); }
    else { el.style.left=''; el.style.top=''; el.style.right=''; el.style.bottom=''; el.style.transform=''; } }
}
const _setState4=setState; // re-apply layout whenever the HUD becomes visible
setState=function(s){ _setState4(s); if(s==='map') applyLayout(); };
document.addEventListener('pointerdown',e=>{
  if(!moveMode||dragEl) return;
  const t=e.target.closest?e.target.closest('.dragme'):null;
  if(!t) return;
  e.stopPropagation(); e.preventDefault();
  const ctl=document.getElementById('controls').getBoundingClientRect();
  const r=t.getBoundingClientRect();
  setElPos(t,r.left-ctl.left,r.top-ctl.top); // freeze visual pos into left/top (no jump)
  const r2=t.getBoundingClientRect();
  dragEl=t; dragOX=e.clientX-r2.left; dragOY=e.clientY-r2.top;
},true);
window.addEventListener('pointermove',e=>{
  if(!dragEl) return; e.preventDefault();
  const ctl=document.getElementById('controls').getBoundingClientRect();
  const r=dragEl.getBoundingClientRect();
  let nx=e.clientX-dragOX-ctl.left, ny=e.clientY-dragOY-ctl.top;
  nx=Math.max(0,Math.min(ctl.width-r.width,nx));
  ny=Math.max(0,Math.min(ctl.height-r.height,ny));
  setElPos(dragEl,nx,ny);
},{passive:false});
function endDrag(){
  if(!dragEl) return;
  const ctl=document.getElementById('controls').getBoundingClientRect();
  const r=dragEl.getBoundingClientRect();
  const L=getLayout(); L.pos=L.pos||{};
  L.pos[dragEl.id]={fx:(r.left-ctl.left)/ctl.width, fy:(r.top-ctl.top)/ctl.height};
  saveLayout(L);
  dragEl=null;
  if(SET.uimode==='minimal'){ SET.uimode='custom'; saveSettings(); applyUIMode(); refreshModeSeg(); }
}
window.addEventListener('pointerup',endDrag);
window.addEventListener('pointercancel',()=>{ dragEl=null; });
function enterMoveMode(){
  if(settingsOpen) closeSettings();
  if(paused) setPaused(false);
  if(state!=='map') return;
  moveMode=true; document.body.classList.add('moving');
  for(const id of DRAG_IDS){ const el=document.getElementById(id); if(el) el.classList.add('dragme'); }
  document.getElementById('moveBar').classList.remove('hidden');
  AU.ui();
}
function exitMoveMode(){
  moveMode=false; dragEl=null; document.body.classList.remove('moving');
  for(const id of DRAG_IDS){ const el=document.getElementById(id); if(el) el.classList.remove('dragme'); }
  document.getElementById('moveBar').classList.add('hidden');
}
document.getElementById('moveDone').addEventListener('click',()=>{ AU.ui(); exitMoveMode(); });
document.getElementById('moveReset').addEventListener('click',()=>{ AU.ui(); saveLayout({}); applyLayout();
  if(SET.uimode==='custom'){ SET.uimode='default'; saveSettings(); applyUIMode(); refreshModeSeg(); } });

// ---- 5. UI MODE presets (minimap exempt — own toggle below) ----
if(!SET.uimode) SET.uimode='default';
// NOTE: minimap has its own dedicated toggle (SET.map) + position setting owned

  AU.ui(); if(player.hp<=0||player.potionCd>0) return;

const _setPaused2=setPaused;
setPaused=function(p){ _setPaused2(p); if(p) refreshPauseExtras(); };
const _buildSettings2=buildSettings;
buildSettings=function(){
  _buildSettings2();
  const rows=document.getElementById('setRows');
  const d=document.createElement('div'); d.className='segRow'; d.id='uimodeRow';
  const s=document.createElement('span'); s.textContent='UI MODE';
  const seg=document.createElement('div'); seg.className='segBtns';
  for(const [k,label] of [['default','DEFAULT'],['minimal','MINIMAL'],['custom','CUSTOM']]){
    const b=document.createElement('button'); b.textContent=label; b.dataset.m=k;

  d.append(s,seg); rows.appendChild(d);
  const d2=document.createElement('div'); d2.className='segRow';

};
function refreshModeSeg(){ const r=document.getElementById('uimodeRow'); if(!r) return;
  r.querySelectorAll('.segBtns button').forEach(b=>{ b.classList.toggle('on',b.dataset.m===SET.uimode);

// boot: apply persisted layout + UI mode
applyLayout();
applyUIMode();
