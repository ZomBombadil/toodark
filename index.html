<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TooDark</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body { font-family:Georgia,'Times New Roman',serif; color:#cfc8bb; touch-action:none;
         user-select:none; -webkit-user-select:none; }
  #wrap { height:100dvh; display:flex; flex-direction:column; background:#000; }
  #stage { flex:1; position:relative; display:flex; align-items:center; justify-content:center;
           background:#000; min-height:0; overflow:hidden; }
  #game { image-rendering:pixelated; image-rendering:crisp-edges; background:#000; }
  /* ---------- overlays ---------- */
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
             justify-content:center; text-align:center; z-index:5; }
  .hidden { display:none !important; }
  #titleUI { background:radial-gradient(ellipse at 50% 60%, rgba(40,4,18,.35), rgba(0,0,0,.92) 75%); }
  #titleUI h1 { font-size:52px; letter-spacing:14px; color:#f2e8ec; font-weight:normal;
                text-shadow:0 0 12px #ff2a44, 0 0 42px #ff2a44, 0 0 90px #a01030, 0 2px 0 #000; margin-left:14px; }
  #titleUI .sub { margin:10px 0 30px; color:#8a93b8; font-style:italic; font-size:15px; letter-spacing:2px;
                text-shadow:0 0 14px rgba(42,223,255,.5); }
  .btn { display:block; min-width:210px; margin:7px auto; padding:12px 18px; font-family:inherit;
         font-size:17px; letter-spacing:3px; color:#c9cede; background:rgba(24,18,14,.85);
         border:1px solid #5a2a3a; cursor:pointer; }
  .btn:active { background:#3a1e2c; color:#ffe9c0; }
  .btn:disabled { opacity:.35; }
  #endUI h2 { font-size:30px; letter-spacing:6px; color:#d9dee9; font-weight:normal; margin-bottom:12px;
              text-shadow:0 0 18px #7a2e0e, 0 2px 0 #000; }
  #endUI { background:radial-gradient(ellipse at 50% 55%, rgba(24,10,5,.92), rgba(0,0,0,.97) 78%); }
  #endUI p { color:#8a8fa8; font-style:italic; margin-bottom:8px; max-width:80%; font-size:14px; }
  #endStats { color:#a8aec8; font-size:14px; margin:10px 0 18px; line-height:1.7; font-family:monospace; }
  #endArt { width:64px; height:64px; display:block; margin:6px auto 10px; image-rendering:pixelated; }
  #mpFlash { position:fixed; inset:0; pointer-events:none; z-index:60; opacity:0; transition:opacity .6s;
              background:radial-gradient(ellipse at 50% 45%, rgba(255,215,120,.55), rgba(255,215,120,0) 70%); }
  /* ---------- bottom controls ---------- */
  #controls { height:168px; flex:0 0 168px; position:relative; background:#07070d;
              border-top:1px solid #3a1020; box-shadow:0 -2px 18px rgba(255,42,68,.12); z-index:4; }
  #padUI { position:absolute; inset:0; }
  #dpad { position:absolute; left:18px; top:14px; width:140px; height:140px; border-radius:50%;
          border:2px solid #4a1e30; background:radial-gradient(circle, rgba(40,16,28,.5), rgba(8,6,12,.7));
          box-shadow:0 0 14px rgba(255,42,68,.15), inset 0 0 18px rgba(0,0,0,.6); }
  #stick { position:absolute; left:50%; top:50%; width:52px; height:52px; border-radius:50%;
           background:radial-gradient(circle at 35% 30%, #3a3f4e, #14161e);
           border:1px solid #ff2a44; transform:translate(-50%,-50%);
           box-shadow:0 0 10px rgba(255,42,68,.4); }
  #actBtn { position:absolute; right:26px; top:44px; width:76px; height:76px; border-radius:50%;
            border:2px solid #ff2a44; background:radial-gradient(circle at 35% 30%, #4a1626, #1c0812);
            color:#ff8a9a; font-size:30px; display:flex; align-items:center; justify-content:center;
            box-shadow:0 0 16px rgba(255,42,68,.35); }
  #actBtn:active { background:#6a1e30; }
  #muteBtn { position:absolute; left:10px; top:6px; width:44px; height:44px; border-radius:50%;
             border:1px solid #333; background:#111; color:#777; font-size:18px;
             display:flex; align-items:center; justify-content:center; }
  /* battle menu */
  #combatCluster { position:absolute; right:8px; bottom:86px; width:190px; height:190px; }
  .cbtn { position:absolute; border-radius:50%; border:2px solid #54222e; background:rgba(12,8,16,.86);
    color:#d9dee9; font-family:monospace; font-size:11px; width:52px; height:52px; }
  .cbtn:active { background:rgba(120,60,20,.9); }
  /* spaced arc (2026-10-07): ATK prime corner, spells stacked left, dodge above ATK, potion top = deliberate reach */
  #btnAtk { width:76px; height:76px; right:0; bottom:0; font-size:15px; border-color:#a05030; }
  #btnSpell1 { right:82px; bottom:6px; }
  #btnSpell2 { right:82px; bottom:64px; }
  #btnDodge { right:6px; bottom:82px; width:46px; height:46px; font-size:9px; }
  #btnPotion { right:6px; bottom:134px; width:40px; height:40px; font-size:14px; }
  /* RANGED (added 2026-10-07): clear of ATK/S1/S2/DODGE/POTION */
  #btnRng { right:82px; bottom:122px; width:48px; height:48px; font-size:10px; }
  #bagBtn { position:absolute; right:10px; top:6px; width:44px; height:34px; font-size:11px;
    border:2px solid #54222e; background:rgba(12,8,16,.86); color:#d9dee9; border-radius:6px; font-family:monospace; }
  /* ---------- pause menu + settings (2026-10-07) ---------- */
  #pauseBtn { position:absolute; left:50%; top:6px; transform:translateX(-50%); width:44px; height:34px;
    font-size:14px; border:2px solid #54222e; background:rgba(12,8,16,.86); color:#d9dee9;
    border-radius:6px; font-family:monospace; z-index:6; }
  #pauseUI, #settingsUI { background:rgba(5,4,6,.94); z-index:40; }
  #pauseUI h2, #settingsUI h2 { color:#d9dee9; font-size:22px; letter-spacing:8px; font-weight:normal;
    margin-bottom:16px; text-shadow:0 0 18px #7a2e0e, 0 2px 0 #000; }
  .setRow { display:flex; align-items:center; justify-content:space-between; gap:14px; min-width:280px;
    margin:9px 0; font-family:monospace; font-size:13px; color:#c9cede; }
  .setRow input[type=range] { width:140px; accent-color:#ff2a44; }
  .setRow input[type=checkbox] { width:20px; height:20px; accent-color:#ff2a44; }
  .setVal { color:#ff2a44; min-width:36px; text-align:right; }
  #invUI, #shopUI, #campUI, #choiceUI { background:rgba(5,4,6,.96); padding:10px; overflow-y:auto; }
  #classCards{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:6px; }
  #diffCards{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:6px; }
  .diffLocked{ opacity:.45; filter:grayscale(.7); }
  .clsCard{ width:45%; background:#141010; border:1px solid #4a4038; border-radius:6px; padding:8px 6px; cursor:pointer; text-align:center; }
  .clsCard:active{ border-color:#a02040; background:#241428; }
  .clsCard canvas{ image-rendering:pixelated; background:#0a0806; border-radius:4px; }
  .clsName{ color:#ff5a68; font-size:14px; letter-spacing:2px; margin:5px 0 2px; }
  .clsTitle{ color:#7a7f96; font-size:10px; font-style:italic; margin-bottom:4px; }
  .clsStats{ color:#a8aec8; font-size:10px; line-height:1.5; margin:4px 0; }
  .clsFlavor{ color:#c9cede; font-size:10px; font-style:italic; line-height:1.45; }
  .clsGear{ color:#7ae08a; font-size:10px; margin-top:4px; }
  #invUI h2, #shopUI h2, #campUI h2, #choiceUI h2 { color:#d9dee9; font-size:16px; letter-spacing:3px; margin:4px 0 8px; }
  .itrow { display:flex; align-items:center; gap:6px; padding:5px 4px; border-bottom:1px solid #2a2420; font-size:12px; }
  .itrow .nm { flex:1; }
  .itrow .ds { color:#7a7f96; font-size:10px; display:block; }
  .mini { font-size:10px; padding:4px 6px; margin:1px; border:1px solid #54222e; background:#14101e;
    color:#d9dee9; border-radius:4px; font-family:monospace; }
  .mini:active { background:#4a2a10; }
  .tab { font-size:11px; padding:5px 8px; margin:0 3px 8px 0; border:1px solid #4a4038; background:#141010;
    color:#a8aec8; border-radius:4px 4px 0 0; font-family:monospace; }
  .tab.on { background:#1c1426; color:#ff5a68; border-color:#a02040; }
  .secT { color:#ff2a44; font-size:12px; letter-spacing:2px; margin:10px 0 4px; }
  /* dialog */
  #dialogUI { position:absolute; inset:0; padding:14px 16px; background:rgba(5,4,6,.92);
              border-top:1px solid #3a1e2c; cursor:pointer; }
  #dlgName { color:#ff2a44; font-size:13px; letter-spacing:2px; margin-bottom:6px; }
  #dlgText { font-size:16px; line-height:1.55; color:#c9cede; font-style:italic; }
  #dlgNext { position:absolute; right:18px; bottom:12px; color:#8a6a3a; font-size:13px;
             animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  #toast { position:absolute; left:50%; bottom:180px; transform:translateX(-50%); z-index:6;
           background:rgba(10,8,6,.9); border:1px solid #4a3a24; color:#e0c890; padding:8px 16px;
           font-size:14px; letter-spacing:1px; pointer-events:none; white-space:nowrap; }
  #toast:not(.hidden) { animation:toastIn .28s cubic-bezier(.2,.9,.25,1.2); }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(10px) scale(.96); }
                       to { opacity:1; transform:translateX(-50%) translateY(0) scale(1); } }
  /* tutorial tracker (added 2026-10-07) */
  #tutUI { position:absolute; left:8px; top:86px; max-width:64%; background:rgba(8,6,10,.88);
           border:1px solid #54222e; border-radius:6px; padding:6px 8px; font-family:monospace;
           font-size:11px; color:#d9dee9; z-index:30; line-height:1.7; }
  #tutUI .done { color:#5a6a4a; text-decoration:line-through; }
  #tutUI .cur { color:#ff5a68; }
  /* ---------- UI-ACCESS (2026-10-07): close/scroll/move-mode/minimal ---------- */
  #questBtn { position:absolute; right:58px; top:6px; width:40px; height:34px; font-size:10px;
    border:2px solid #54222e; background:rgba(12,8,16,.86); color:#d9dee9; border-radius:6px; font-family:monospace; }
  #btnSetBack.bigdone { min-width:260px; padding:16px 18px; font-size:19px; }
  .scrollY { overflow-y:auto; touch-action:pan-y; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    flex:1 1 auto; min-height:0; width:100%; }
  #setRows.scrollY { max-height:100%; }
  .scue { display:none; color:#ff2a44; font-size:10px; font-family:monospace; letter-spacing:2px;
    pointer-events:none; padding:2px 0 0; animation:blink 1.6s infinite; }
  #moveBar { position:absolute; left:50%; top:44px; transform:translateX(-50%); z-index:60;
    background:rgba(10,8,6,.94); border:2px solid #ff2a44; border-radius:8px; padding:6px 10px;
    display:flex; gap:8px; align-items:center; font-family:monospace; font-size:11px; color:#ff5a68; }
  #moveBar button { font-family:monospace; font-size:11px; padding:8px 12px; border:1px solid #ff2a44;
    background:#14101e; color:#ff5a68; border-radius:6px; }
  #moveBar button:active { background:#4a2a10; }
  body.moving .dragme { outline:2px dashed #ff5a68 !important; outline-offset:2px; cursor:move; }
  .segRow { display:flex; align-items:center; justify-content:space-between; gap:14px; min-width:280px;
    margin:9px 0; font-family:monospace; font-size:13px; color:#c9cede; }
  .segBtns { display:flex; gap:4px; }
  .segBtns button { font-family:monospace; font-size:10px; padding:6px 8px; border:1px solid #4a4038;
    background:#141010; color:#a8aec8; border-radius:4px; }
  .segBtns button.on { background:#1c1426; color:#ff5a68; border-color:#a02040; }
  .segBtns button:disabled { opacity:.35; }
  .setBtn { font-family:monospace; font-size:12px; padding:8px 14px; border:1px solid #54222e;
    background:#14101e; color:#d9dee9; border-radius:6px; }
  .setBtn:active { background:#4a2a10; }
  @media (pointer:fine) { #dpad, #actBtn { opacity:.55; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="140" height="288"></canvas>
    <div id="titleUI" class="overlay">
      <h1>TooDark</h1>
      <div class="sub">the dark remembers.</div>
      <button class="btn" id="btnNew">NEW GAME</button>
      <button class="btn hidden" id="btnCont">CONTINUE</button>
    </div>
    <div id="classUI" class="overlay hidden">
      <h2>PICK YOUR POISON</h2>
      <div class="sub" style="margin-bottom:4px">four ways to die. choose one.</div>
      <div id="classCards"></div>
    </div>
    <div id="diffUI" class="overlay hidden">
      <h2>HOW DEEP IS YOUR GRAVE?</h2>
      <div class="sub" style="margin-bottom:4px">pick your suffering. choose wisely.</div>
      <div id="diffCards"></div>
    </div>
    <div id="endUI" class="overlay hidden">
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <div id="endStats"></div>
      <button class="btn" id="btnEndA"></button>
      <button class="btn hidden" id="btnEndB"></button>
    </div>
  </div>
  <div id="controls">
    <div id="padUI">
      <div id="dpad"><div id="stick"></div></div>
      <div id="muteBtn">♪</div>
    </div>
    <div id="combatCluster" class="hidden">
      <button class="cbtn" id="btnAtk">ATK</button>
      <button class="cbtn" id="btnSpell1">S1</button>
      <button class="cbtn" id="btnSpell2">S2</button>
      <button class="cbtn" id="btnDodge">DODGE</button>
      <button class="cbtn" id="btnPotion">🧪</button>
      <button class="cbtn" id="btnRng">RNG</button>
    </div>
    <button id="bagBtn" class="hidden">BAG</button>
    <button id="questBtn" class="hidden">QST</button>
    <button id="pauseBtn" class="hidden">&#10074;&#10074;</button>
    <div id="moveBar" class="hidden"><span>DRAG BUTTONS</span><button id="moveReset">RESET DEFAULTS</button><button id="moveDone">DONE</button></div>
    <div id="pauseUI" class="overlay hidden">
      <h2>PAUSED</h2>
      <button class="btn" id="btnResume">RESUME</button>
      <button class="btn" id="btnPausePotion">DRINK POTION</button>
      <button class="btn" id="btnPauseMute">MUTE: OFF</button>
      <button class="btn" id="btnSettings">SETTINGS</button>
      <button class="btn" id="btnNG" style="display:none">BEGIN NG+ CYCLE</button>
      <button class="btn" id="btnAbandon">ABANDON RUN</button>
    </div>
    <div id="settingsUI" class="overlay hidden">
      <h2>SETTINGS</h2>
      <div id="setRows" class="scrollY"></div>
      <div class="scue">▼ scroll ▼</div>
      <button class="btn" id="btnSetBack">DONE</button>
    </div>
    <div id="invUI" class="overlay hidden">
      <h2>INVENTORY</h2>
      <div id="invTabs"></div>
      <div id="invBody" class="scrollY"></div>
      <div class="scue">▼ scroll ▼</div>
      <button class="btn" id="invClose">CLOSE</button>
    </div>
    <div id="shopUI" class="overlay hidden">
      <h2>FENN THE ASH-PEDDLER</h2>
      <div id="shopGold"></div>
      <div class="secT">BUY</div><div id="shopBuy" class="scrollY"></div>
      <div class="secT">SELL</div><div id="shopSell" class="scrollY"></div>
      <div class="scue">▼ scroll ▼</div>
      <button class="btn" id="shopClose">LEAVE</button>
    </div>
    <div id="campUI" class="overlay hidden">
      <h2>SHRINE CAMP</h2>
      <div id="campBody" class="scrollY"></div>
      <div class="scue">▼ scroll ▼</div>
      <button class="btn" id="campClose">LEAVE</button>
    </div>
    <div id="choiceUI" class="overlay hidden">
      <h2 id="choiceTitle"></h2>
      <div id="choiceBtns"></div>
    </div>
    <div id="dialogUI" class="hidden">
      <div id="dlgName"></div><div id="dlgText"></div><div id="dlgNext">tap ▸</div>
    </div>
  </div>
  <div id="toast" class="hidden"></div>
  <div id="tutUI" class="hidden"></div>
</div>
<script>
'use strict';
/* ================= TooDark — 2D dark-fantasy RPG =================
   Single file, zero external assets, offline. Original art/writing/audio. */
let W=140; const H=288, TILE=16; // W adapts to screen aspect; tighter POV (was 176x360)
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
// adaptive viewport: match the screen aspect exactly — no side bars, ever
function fitCanvas(){
  const st=document.getElementById('stage');
  const r=st.getBoundingClientRect();
  if(r.width<2||r.height<2) return;
  const newW=Math.max(96,Math.min(300,Math.round(H*r.width/r.height)));
  if(newW!==W){ W=newW; sizeBuffers(); }
  cv.style.width=r.width+'px'; cv.style.height=r.height+'px';
}
window.addEventListener('resize',fitCanvas);
/* ---------------- input ---------------- */
const input={dx:0,dy:0,action:false,actionEdge:false,up:false,down:false,left:false,right:false};
const keys={};
window.addEventListener('keydown',e=>{
  if(e.repeat) return;
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(e.code==='Space'||e.code==='KeyE') pushAction();
  if(e.code==='KeyM') AU.toggleMute();
  if(e.code==='Escape'&&(state==='inv'||state==='shop'||state==='camp'||state==='choice')){ e.stopImmediatePropagation(); setState('map'); }
  if(e.code==='KeyI'&&state==='map') openInv();
  if(state==='map'){
    if(e.code==='KeyJ') tryAttack();
    if(e.code==='KeyK') castSpell(0);
    if(e.code==='KeyL') castSpell(1);
    if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight') tryDodge();
  }
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; });
function pollKeys(){
  input.left=!!(keys.ArrowLeft||keys.KeyA); input.right=!!(keys.ArrowRight||keys.KeyD);
  input.up=!!(keys.ArrowUp||keys.KeyW); input.down=!!(keys.ArrowDown||keys.KeyS);
}
function pushAction(){ input.action=true; input.actionEdge=true; }
// --- touch d-pad ---
(function(){
  const dp=document.getElementById('dpad'), st=document.getElementById('stick');
  let pid=null, cx=0, cy=0;
  function setVec(t){
    const r=dp.getBoundingClientRect();
    cx=r.left+r.width/2; cy=r.top+r.height/2;
    let vx=t.clientX-cx, vy=t.clientY-cy;
    const m=Math.hypot(vx,vy), max=r.width/2-10;
    if(m>max){ vx=vx/m*max; vy=vy/m*max; }
    st.style.transform=`translate(calc(-50% + ${vx}px), calc(-50% + ${vy}px))`;
    const dz=12;
    input.dx=Math.abs(vx)>dz?vx/max:0; input.dy=Math.abs(vy)>dz?vy/max:0;
  }
  dp.addEventListener('pointerdown',e=>{ pid=e.pointerId; dp.setPointerCapture(pid); setVec(e); });
  dp.addEventListener('pointermove',e=>{ if(e.pointerId===pid) setVec(e); });
  const end=e=>{ if(e.pointerId===pid){ pid=null; input.dx=0; input.dy=0;
    st.style.transform='translate(-50%,-50%)'; } };
  dp.addEventListener('pointerup',end); dp.addEventListener('pointercancel',end);
  const tap=(id,fn)=>{ const el=document.getElementById(id);
    el.addEventListener('pointerdown',e=>{ e.preventDefault(); fn(); }); };
  tap('btnAtk',()=>{ if(state==='map') tryAttack(); else pushAction(); });
  tap('btnSpell1',()=>{ if(state==='map') castSpell(0); });
  tap('btnSpell2',()=>{ if(state==='map') castSpell(1); });
  tap('btnDodge',()=>{ if(state==='map') tryDodge(); });
  tap('btnPotion',()=>{ if(state==='map') usePotion(); });
  tap('btnRng',()=>{ if(state==='map') tryRanged(); });
  tap('bagBtn',()=>{ if(state==='map') openInv(); });
  tap('invClose',()=>setState('map'));
  tap('shopClose',()=>setState('map'));
  tap('campClose',()=>setState('map'));
  document.getElementById('dialogUI').addEventListener('pointerdown',()=>pushAction());
  document.getElementById('muteBtn').addEventListener('pointerdown',e=>{e.stopPropagation();AU.toggleMute();});
})();
function moveVec(){
  pollKeys();
  let x=input.dx, y=input.dy;
  if(keys.ArrowLeft||keys.KeyA) x=-1; if(keys.ArrowRight||keys.KeyD) x=1;
  if(keys.ArrowUp||keys.KeyW) y=-1; if(keys.ArrowDown||keys.KeyS) y=1;
  if(x===0&&y===0) return null;
  if(Math.abs(x)>Math.abs(y)) return {x:Math.sign(x),y:0};
  return {x:0,y:Math.sign(y)};
}
function consumeAction(){ const a=input.actionEdge; input.actionEdge=false; input.action=false; return a; }
// toast
let toastT=null;
function toast(msg,ms){ const t=document.getElementById('toast');
  t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add('hidden'),ms||2200); }
/* ================= SPRITES (original pixel art, drawn in code) ================= */
function drawSpr(g,rows,pal,x,y,flip){
  x=Math.round(x); y=Math.round(y);
  for(let j=0;j<rows.length;j++){ const r=rows[j];
    for(let i=0;i<r.length;i++){ const c=pal[r[i]]; if(!c) continue;
      g.fillStyle=c; g.fillRect(x+(flip?(r.length-1-i):i), y+j, 1, 1); } }
}
const PAL_P={k:'#0b0a0e',H:'#101018',h:'#181824',F:'#08080c',e:'#ff2a44',
  C:'#14141c',c:'#1e1e28',B:'#5a1626',S:'#9aa0ae',s:'#4a4e5a',P:'#101016'};
const P_BODY=[
"....kkkk....",
"..kkHHHHkk..",

  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let zone=null, seedBase=1;
let TINT=null;

function biomeFor(d){
  if(d<12) return null;
  return (d%2===0)
    ? {id:'weeping',name:'THE WEEPING DARK',sub:'the dark grows teeth of its own — fungal, patient, hungry',tint:'rgba(8,90,70,0.22)'}
    : {id:'teeth',name:'THRONE OF TEETH',sub:'everything here was eaten. the bones kept the receipts',tint:'rgba(150,16,48,0.20)'};
}

}

function depthFoeTypes(depth){
  const t=['hound','hound','wraith','husk'];
  if(depth>=2) t.push('cultist','dreg','dreg','grinner','grinner');
  if(depth>=3) t.push('golem','cultist','skitterling','skitterling','watcher','gorged','stitchwalker');
  if(depth>=4) t.push('mourn','golem','grinner','watcher');
  if(depth>=10) t.push('reliquary','reliquary'); // ENDGAME-CONTENT 2026-10-07
  if(depth>=12) t.push('duskw','duskw','cantor','cantor','choirmaw');
  return t;
}
function bfsReach(g,w,h,sx,sy,tx,ty){
  if(g[ty][tx]==='#') return false;
  const seen=new Set([sy*w+sx]), q=[[sx,sy]];
  const solid=(x,y)=>x<0||y<0||x>=w||y>=h||['#','W','o','r','D'].includes(g[y][x]);
  while(q.length){ const [x,y]=q.pop();
    if(x===tx&&y===ty) return true;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx,ny=y+dy,k=ny*w+nx;
      if(!seen.has(k)&&!solid(nx,ny)){ seen.add(k); q.push([nx,ny]); } } }
  return false;
}
function genZone(depth,seed){
  const R=mulberry32(seed), w=48, h=36;
  const g=[]; for(let y=0;y<h;y++) g.push(new Array(w).fill('.'));
  for(let x=0;x<w;x++){ g[0][x]='#'; g[h-1][x]='#'; }
  for(let y=0;y<h;y++){ g[y][0]='#'; g[y][w-1]='#'; }
  const open=(x,y)=>x>0&&y>0&&x<w-1&&y<h-1&&g[y][x]==='.';
  const scatter=(ch,n)=>{ let placed=0,tries=0;
    while(placed<n&&tries<n*30){ tries++;
      const x=2+Math.floor(R()*(w-4)), y=2+Math.floor(R()*(h-4));
      if(open(x,y)){ g[y][x]=ch; placed++; } } };
  scatter('#',55); scatter('r',20); scatter('W',9);
  for(let i=0;i<4;i++){ const x=2+Math.floor(R()*(w-5)), y=2+Math.floor(R()*(h-5));
    let ok=true; for(let a=0;a<2;a++)for(let b=0;b<2;b++) if(!open(x+a,y+b)) ok=false;
    if(ok) for(let a=0;a<2;a++)for(let b=0;b<2;b++) g[y+b][x+a]='o'; }
  const cx=w>>1, cy=h-8;
  const clear=(x0,y0,x1,y1)=>{ for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)
    if(x>0&&y>0&&x<w-1&&y<h-1) g[y][x]='.'; };
  clear(cx-5,cy-4,cx+5,cy+4);
  const near=(x,y,r)=>{ for(let t=0;t<80;t++){ const nx=x+Math.floor((R()*2-1)*r), ny=y+Math.floor((R()*2-1)*r);
    if(open(nx,ny)) return {tx:nx,ty:ny}; } return null; };
  const far=(x,y,mind)=>{ for(let t=0;t<80;t++){ const nx=2+Math.floor(R()*(w-4)), ny=2+Math.floor(R()*(h-4));
    if(open(nx,ny)&&Math.hypot(nx-x,ny-y)>mind) return {tx:nx,ty:ny}; } return null; };
  const shr=near(cx-5,cy,5)||{tx:cx-5,ty:cy}; g[shr.ty][shr.tx]='S';
  const mer=near(cx+5,cy,5)||{tx:cx+5,ty:cy}; g[mer.ty][mer.tx]='M';
  const st=near(cx,4,9)||{tx:cx,ty:3};
  const isGiantDepth=depth%4===0;
  let boss=null;
  if(isGiantDepth){ const gt=ensureGiantFoe(depth); const bp=near(st.tx,st.ty+3,4)||{tx:st.tx,ty:st.ty+3};
    boss={type:gt,tx:bp.tx,ty:bp.ty}; }
  g[st.ty][st.tx]='>';
  // themed dressing clusters
  const dress=[];
  if(depth>=2){ const c=far(cx,cy,14); if(c){ for(let a=0;a<3;a++)for(let b=0;b<2;b++)
    if(open(c.tx+a,c.ty+b)){ g[c.ty+b][c.tx+a]='u'; } dress.push({k:'carnival',...c}); } }
  if(depth>=3){ const c=far(cx,cy,14); if(c){ for(let a=0;a<3;a++)for(let b=0;b<3;b++)
    if(open(c.tx+a,c.ty+b)){ g[c.ty+b][c.tx+a]='v'; } dress.push({k:'crater',...c}); }
    const f=far(cx,cy,14); if(f){ for(let a=0;a<3;a++)for(let b=0;b<2;b++)
    if(open(f.tx+a,f.ty+b)){ g[f.ty+b][f.tx+a]='f'; } dress.push({k:'flesh',...f}); } }
  // ENDGAME-CONTENT 2026-10-07: one new dressing set per depth band
  if(depth>=1&&depth<=3){ const c=far(cx,cy,14); if(c){ for(let a=0;a<2;a++)for(let b=0;b<2;b++)
    if(open(c.tx+a,c.ty+b)) g[c.ty+b][c.tx+a]='e'; dress.push({k:'embercracks',...c}); } }
  if(depth>=4&&depth<=7){ const c=far(cx,cy,14); if(c){ for(let a=0;a<3;a++)
    if(open(c.tx+a,c.ty)) g[c.ty][c.tx+a]='a'; dress.push({k:'warbanners',...c}); } }
  if(depth>=8&&depth<=11){ const c=far(cx,cy,14); if(c){ for(let a=0;a<2;a++)for(let b=0;b<2;b++)
    if(open(c.tx+a,c.ty+b)) g[c.ty+b][c.tx+a]='h'; dress.push({k:'voidglass',...c}); } }
  if(depth>=12){ const B=biomeFor(depth), c=far(cx,cy,14); if(c){ const ch=B.id==='weeping'?'s':'n';
    for(let a=0;a<3;a++)for(let b=0;b<2;b++)
    if(open(c.tx+a,c.ty+b)) g[c.ty+b][c.tx+a]=ch; dress.push({k:B.id,...c}); } }
  // recruit tile
  let recruit=null;
  const rkey=depth===2?'dunric':depth===3?'issa':depth===5?'pell':null; // LAIR 2026-10-07: depth 4 is a boss lair now, Pell moved to 5
  if(rkey&&!party.find(m=>m.key===rkey&&m.recruited)){ const rp=near(shr.tx,shr.ty,4)||shr;
    recruit={key:rkey,tx:rp.tx,ty:rp.ty}; }
  // notes & spirits
  const notes=[]; const ni=[Math.floor(R()*NOTE_T.length),Math.floor(R()*NOTE_T.length)];
  for(const i of ni){ const p=far(cx,cy,10); if(p) notes.push({tx:p.tx,ty:p.ty,name:NOTE_T[i][0],text:NOTE_T[i][1]}); }
  const spirits=[]; for(let i=0;i<1+Math.floor(R()*2);i++){ const p=far(cx,cy,8);
    if(p) spirits.push({tx:p.tx,ty:p.ty,line:SPIRIT_T[Math.floor(R()*SPIRIT_T.length)]}); }
  // TORCHES: standing torches to light; braziers ring boss arenas
  const torches=[];
  const nT=4+Math.floor(R()*3);
  for(let i=0;i<nT;i++){ const p=far(cx,cy,8); if(p) torches.push({tx:p.tx,ty:p.ty,kind:'torch',lit:false}); }
  // GOTHIC 2026-10-07: candelabras scattered through the depths (lightable, torch system)
  const nC=3+Math.floor(R()*3);
  for(let i=0;i<nC;i++){ const p=far(cx,cy,9); if(p) torches.push({tx:p.tx,ty:p.ty,kind:'candelabra',lit:false}); }
  // GOTHIC 2026-10-07: coffins (openable) and hanging chains (decor)
  const coffins=[];
  for(let i=0;i<2+Math.floor(R()*3);i++){ const p=far(cx,cy,10); if(p) coffins.push({tx:p.tx,ty:p.ty,opened:false}); }
  const chains=[];
  for(let i=0;i<3+Math.floor(R()*4);i++){ const p=far(cx,cy,8); if(p) chains.push({tx:p.tx,ty:p.ty,len:3+Math.floor(R()*4)}); }
  if(isGiantDepth&&boss){ const offs=[[-4,-3],[4,-3],[-4,3],[4,3]];
    for(const [ox,oy] of offs){ const bx=boss.tx+ox, by=boss.ty+oy;
      if(bx>1&&by>1&&bx<w-2&&by<h-2&&g[by][bx]==='.') torches.push({tx:bx,ty:by,kind:'brazier',lit:false}); } }
  // enemies
  const types=depthFoeTypes(depth), spawns=[];
  const nE=6+Math.floor(R()*5);
  for(let i=0;i<nE;i++){ const p=far(cx,cy,11); if(!p) continue;
    const type=types[Math.floor(R()*types.length)];
    spawns.push({type,tx:p.tx,ty:p.ty,elite:R()<diffOf().elite&&depth>=2}); } // DIFFICULTY: elite rate per tier
  const z={depth,seed,w,h,map:g,entry:{tx:cx,ty:cy+2},shrine:shr,merch:mer,
    stair:st,stairOpen:!isGiantDepth,notes,spirits,spawns,boss,recruit,dress,torches,
    coffins,chains}; // GOTHIC 2026-10-07: coffins + chains
  // validate reachability
  const e=z.entry;
  if(!bfsReach(g,w,h,e.tx,e.ty,shr.tx,shr.ty)) return null;
  if(!bfsReach(g,w,h,e.tx,e.ty,mer.tx,mer.ty)) return null;
  if(!bfsReach(g,w,h,e.tx,e.ty,st.tx,st.ty)) return null;
  return z;
}

   Dedicated boss arenas. Boss depths (4,8,12...) generate as enclosed lairs

   Sections: LAIR_DEFS (names/flavor) / genLair / zoneLair / enterLairIntro /
   enterKingLair / spawnZoneFoes / openLairExit / boss chests + genBossLoot. */

let lairBanner=null, lairIntroCd=0;
function genLair(depth,bossType){
  const D=LAIR_DEFS[bossType]||LAIR_DEFS.king;
  const tut=(bossType==='king');
  const w=tut?32:38, h=tut?24:30;
  const R=mulberry32(((seedBase||1)*7919+depth*104729+(tut?7:bossType==='vhexul'?13:bossType==='corvex'?29:43))>>>0);
  const g=[]; for(let y=0;y<h;y++) g.push(new Array(w).fill('.'));
  for(let x=0;x<w;x++){ g[0][x]='W'; g[h-1][x]='W'; }
  for(let y=0;y<h;y++){ g[y][0]='W'; g[y][w-1]='W'; }
  const cx=w>>1;
  const open=(x,y)=>x>0&&y>0&&x<w-1&&y<h-1&&g[y][x]==='.';
  // obsidian pillars (2x2), clear of center + entry column
  const pillars=tut?[[6,6],[w-8,6]]:[[5,5],[w-7,5],[5,h-7],[w-7,h-7]];
  for(const [px,py] of pillars) for(let a=0;a<2;a++)for(let b=0;b<2;b++)
    if(px+a>0&&py+b>0&&px+a<w-1&&py+b<h-1) g[py+b][px+a]='W';
  // brazier rows along east/west walls
  for(let y=4;y<h-3;y+=6){ if(open(2,y)) g[y][2]='B'; if(open(w-3,y)) g[y][w-3]='B'; }
  // bone piles
  const nB=tut?6:12;
  for(let i=0;i<nB;i++){ const x=2+((R()*(w-4))|0), y=2+((R()*(h-4))|0); if(open(x,y)) g[y][x]='b'; }
  const entry={tx:cx,ty:h-4};
  const boss={type:bossType,tx:cx,ty:5};
  const stair={tx:cx+5,ty:h-3};
  g[entry.ty][entry.tx]='.'; g[stair.ty][stair.tx]='>'; g[boss.ty][boss.tx]='.';
  // keep a clear lane from entry to boss
  for(let y=boss.ty+1;y<entry.ty;y++) g[y][cx]='.';
  // TORCH: brazier tiles become lightable torch entities (tile base stays, flame via objs)
  const torches=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++) if(g[y][x]==='B') torches.push({tx:x,ty:y,kind:'brazier',lit:false,lairB:true});
  // GOTHIC 2026-10-07: candelabra rows between the braziers (auto-ignite on entry)
  for(let y=7;y<h-3;y+=6){ if(open(4,y)) torches.push({tx:4,ty:y,kind:'candelabra',lit:false,lairB:true});
    if(open(w-5,y)) torches.push({tx:w-5,ty:y,kind:'candelabra',lit:false,lairB:true}); }
  // GOTHIC 2026-10-07: hanging chains along the walls, coffins for the tithe-dead
  const chains=[];
  for(let x=4;x<w-4;x+=5){ if(open(x,2)) chains.push({tx:x,ty:2,len:4}); }
  const coffins=[];
  for(let i=0;i<2;i++){ const x=3+((R()*(w-6))|0), y=h-6-((R()*4)|0);
    if(open(x,y)) coffins.push({tx:x,ty:y,opened:false}); }
  return {depth,seed:(depth*31+bossType.length),w,h,map:g,entry,shrine:null,merch:null,
    stair,stairOpen:false,notes:[],spirits:[],spawns:[],boss,recruit:null,dress:[],
    chests:[],torches,coffins,chains,lair:{depth,type:bossType,name:D.name,sub:D.sub,line:D.line,hint:D.hint,pre:D.pre}};
}
function zoneLair(depth,bossType){
  const z=genLair(depth,bossType);
  zone=z; MW=z.w; MH=z.h; MAP=z.map;
  setDepthPalette(depth);
  TINT=(LAIR_DEFS[bossType]||LAIR_DEFS.king).tint;
}

    (zone.boss.ty+.5)*16+(Math.random()-0.5)*130,true,bd);
}

  enemies.forEach((e,i)=>{ if(dd[i]) e.dead=true; });

  trail.length=0; decals.length=0; player.secondHeartUsed=false;

  for(const m of party){ if(m.recruited&&m.active){ m.x=player.x; m.y=player.y+14; } }
  updateCamera(player.x,player.y);
  setState('map'); saveGame();
  AU.mapStart();
  enterLairIntro();
}

function genBossLoot(depth,bossType,forceRelic){
  const rarity=forceRelic?'relic':(Math.random()<0.7?'relic':'fine'); // rare-or-better floor
  const slots=['weapon','garb','charm'];
  const slot=slots[(Math.random()*3)|0];
  const base=LOOT_BASE[slot][(Math.random()*LOOT_BASE[slot].length)|0];
  const mult=rarity==='relic'?3.6:2.2; // stronger rolls than normal drops (3 / 1.8)
  const mods={};
  if(slot==='weapon') mods.atk=Math.max(1,Math.round((2+depth*0.9)*mult));
  if(slot==='garb'){ mods.def=Math.max(1,Math.round((1+depth*0.55)*mult)); mods.mhp=Math.round(depth*3*mult); }
  if(slot==='charm'){ if(Math.random()<0.5) mods.atk=Math.max(1,Math.round(depth*0.5*mult));
    else mods.mmp=Math.round(depth*2.2*mult); }

/* ---------------- player movement ---------------- */
function solidAt(px,py){
  // feet bbox 10x8
  const x0=Math.floor((px-5)/16),x1=Math.floor((px+5)/16);
  const y0=Math.floor((py-2)/16),y1=Math.floor((py+6)/16);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)
    if(isSolid(tx,ty)) return true;
  return false;
}
function movePlayer(dt){
  const v=moveVec();
  player.moving=!!v;
  if(player.moving) tutEvent('move'); // QUESTS tutorial
  let sp=58*(1+((player.tal||{}).moveMul||0)); // TALENT: Ashwalker
  if(hasTrait('miser')) sp*=0.85;
  if(player.slowT>0) sp*=0.6;
  if(player.dodgeT>0){ // dodge dash
    const nx=player.x+Math.cos(player.dodgeA)*230*dt, ny=player.y+Math.sin(player.dodgeA)*230*dt;
    if(!solidAt(nx,player.y)) player.x=nx; if(!solidAt(player.x,ny)) player.y=ny;
  } else if(player.lungeT>0){ // attack lunge
    const nx=player.x+Math.cos(player.lungeA)*130*dt, ny=player.y+Math.sin(player.lungeA)*130*dt;
    if(!solidAt(nx,player.y)) player.x=nx; if(!solidAt(player.x,ny)) player.y=ny;
  } else if(v){
    player.dir=v.y<0?'up':v.y>0?'down':v.x<0?'left':'right';
    player.animT+=dt;
    const nx=player.x+v.x*sp*dt, ny=player.y+v.y*sp*dt;
    if(!solidAt(nx,player.y)) player.x=nx;
    if(!solidAt(player.x,ny)) player.y=ny;
  } else player.animT=0;
  // knockback
  player.x+= (player.kbx||0)*dt; player.y+=(player.kby||0)*dt;
  player.x=Math.max(8,Math.min(MW*16-8,player.x));
  player.y=Math.max(8,Math.min(MH*16-8,player.y));
  if(player.flash>0)player.flash-=dt;
  player.playT+=dt;
}

/* ---------------- interactions ---------------- */
function nearestInteract(){
  const px=player.x, py=player.y;
  let best=null,bd=22;
  if(zone){
    for(const n of zone.notes){ const d=Math.hypot(n.tx*16+8-px,n.ty*16+8-py);
      if(d<bd){bd=d;best={kind:'note',n};} }
    for(const sp of zone.spirits){ const d=Math.hypot(sp.tx*16+8-px,sp.ty*16+8-py);
      if(d<bd){bd=d;best={kind:'spirit',sp};} }
    if(zone.shrine){ const sh=zone.shrine, d=Math.hypot((sh.tx+.5)*16-px,(sh.ty+.5)*16-py);
      if(d<bd+4){bd=d;best={kind:'shrine'};} } // LAIR 2026-10-07: shrine may be null in lairs
    if(zone.chests) for(const c of zone.chests){ if(c.opened) continue; // LAIR 2026-10-07: boss chests
      const d=Math.hypot((c.tx+.5)*16-px,(c.ty+.5)*16-py);
      if(d<bd+6){bd=d;best={kind:'chest',c};} }
    if(zone.coffins) for(const c of zone.coffins){ if(c.opened) continue; // GOTHIC 2026-10-07: coffins
      const d=Math.hypot((c.tx+.5)*16-px,(c.ty+.5)*16-py);
      if(d<bd+6){bd=d;best={kind:'coffin',c};} }
    if(zone.merch){ const d=Math.hypot((zone.merch.tx+.5)*16-px,(zone.merch.ty+.5)*16-py);
      if(d<bd+4){bd=d;best={kind:'merchant'};} }
    if(zone.stair){ const d=Math.hypot((zone.stair.tx+.5)*16-px,(zone.stair.ty+.5)*16-py);
      if(d<bd+4){bd=d;best={kind:'stair'};} }
    if(zone.recruit){ const r=zone.recruit, d=Math.hypot((r.tx+.5)*16-px,(r.ty+.5)*16-py);
      if(d<bd+4){bd=d;best={kind:'recruit',r};} }
    for(const tc of (zone.torches||[])){ if(tc.lit||tc.lairB) continue; // TORCH: light prompt
      const d=Math.hypot((tc.tx+.5)*16-px,(tc.ty+.5)*16-py);
      if(d<bd+4){bd=d;best={kind:'torch',tc};} }
    if(zone.depth===1&&!zone.lair){ const d=Math.hypot((BOSS_SPAWN.tx+.5)*16-px,((BOSS_SPAWN.ty+.5)*16+10)-py); // LAIR 2026-10-07: door only on tutorial map
      if(d<28){best={kind:'door'};} }
  }
  return best;
}

function drawHUD(){

  if(hudHp<0){ hudHp=player.hp; hudMp=player.mp; } // SMOOTH: bars drain toward targets
  hudHp+=(player.hp-hudHp)*0.16; hudMp+=(player.mp-hudMp)*0.16;
  if(Math.abs(player.hp-hudHp)<0.5) hudHp=player.hp;
  if(Math.abs(player.mp-hudMp)<0.5) hudMp=player.mp;
  pill(8,8,60,5,'#5a4a33'); pill(8,8,60*Math.max(0,hudHp/player.maxhp),5,'#a83232');
  pill(8,16,60,5,'#5a4a33'); pill(8,16,60*Math.max(0,hudMp/player.maxmp),5,'#3a6aa8');
  ctx.fillStyle='#d8cdb4'; ctx.font='6px monospace';
  ctx.fillText('Lv'+player.level,72,12);
  ctx.fillText('HP',72,20);
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(W-64,4,60,26);
  ctx.fillStyle='#c9a86a'; ctx.fillText(player.gold+'g',W-58,12);
  const pc=player.inv.find(i=>i.id==='ember_potion');
  ctx.fillStyle='#c86a6a'; ctx.fillText('◈'+(pc?pc.qty:0),W-58,20);
  ctx.fillStyle='#8a7a63'; ctx.fillText('D'+player.depth+'·'+diffOf().short+(player.ng>0?'·NG'+player.ng:''),W-58,28); // DIFFICULTY tag + ENDGAME-CONTENT NG tag
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(4,H-16,120,12);
  ctx.fillStyle='#8a7a63'; ctx.fillText('XP '+player.xp+'/'+xpNext(player.level),8,H-7);
  // companion mini-bars
  let cy2=34;
  for(const m of party){ if(!m.recruited||!m.active) continue;

let anyAggro=false;
function pickTarget(e){
  if(e.tauntM&&e.tauntM.hp>0) return e.tauntM;
  let best=null,bd=1e9;
  for(const m of activeParty()){ if(m.hp<=0) continue;
    const d=Math.hypot(m.x-e.x,m.y-e.y); if(d<bd){bd=d;best=m;} }
  return best;
}
function tickFoe(e,dt){
  if(e.dead) return;
  const a=AI[e.type]||AI.hound;
  if(e.flash>0)e.flash-=dt;
  if(e.staggerT>0)e.staggerT-=dt;
  if(e.stunT>0){ e.stunT-=dt; if(e.stunT<=0&&e.state==='stagger'){e.state='chase';} }
  if(e.contactT>0)e.contactT-=dt;
  if(e.atkCd>0)e.atkCd-=dt;
  if(e.tauntCd>0)e.tauntCd-=dt;
  if(e.boss&&e.aggroT>0&&Math.random()<dt*0.05) bossTaunt(e);
  // burn dot
  if(e.burnT>0){ e.burnT-=dt; e.burnTick=(e.burnTick||0)-dt;
    if(e.burnTick<=0){ e.burnTick=0.6; const bd=Math.max(1,Math.round(e.maxhp*0.03*lanternBurnMul())); // LANTERN: burn dmg
      e.hp-=bd; dmgNum(e.x,e.y-e.h-4,bd,'#ff9a3a'); blood(e.x,e.y-6,2,'#ff6a2a',40);
      if(e.hp<=0){ killFoe(e,0); return; } } }
  // knockback physics
  e.kbx=(e.kbx||0)*0.88; e.kby=(e.kby||0)*0.88;
  if(Math.abs(e.kbx)>2||Math.abs(e.kby)>2){
    const nx=e.x+e.kbx*dt, ny=e.y+e.kby*dt;
    if(!solidAt(nx,e.y))e.x=nx; if(!solidAt(e.x,ny))e.y=ny; }
  const tgt=pickTarget(e);
  if(!tgt){ e.state='wander'; }
  else{
    const dx=tgt.x-e.x, dy=tgt.y-e.y, dist=Math.hypot(dx,dy);
    if(dist<a.sight) e.aggroT=5;
    if(e.aggroT>0){ e.aggroT-=dt; anyAggro=true; } else { e.state='wander'; e.tele=null; }
    e.bob+=dt*3;
    const st=e.state;
    if(st==='stagger'){ e.stateT-=dt; e.tele=null;
      if(e.stateT<=0) e.state='chase'; }
    else if(st==='windup'){ e.stateT-=dt;
      e.ang=Math.atan2(dy,dx);
      if(e.stateT<=0){ e.tele=null; doFoeAttack(e,tgt,a); } }
    else if(st==='recover'){ e.stateT-=dt; if(e.stateT<=0) e.state='chase'; }
    else if(st==='dash'){ // lunging
      e.stateT-=dt;
      const nx=e.x+Math.cos(e.dashA)*e.dashS*dt, ny=e.y+Math.sin(e.dashA)*e.dashS*dt;
      if(!solidAt(nx,e.y))e.x=nx; if(!solidAt(e.x,ny))e.y=ny;
      if(Math.hypot(tgt.x-e.x,tgt.y-e.y)<e.w/2+9&&e.contactT<=0){
        hurtMember(tgt,e.atk*a.mul,e.x,e.y); e.contactT=0.9; }
      if(e.stateT<=0){ e.state='recover'; e.stateT=0.5; } }
    else if(st==='flurry'){ e.stateT-=dt; e.flurryT-=dt;
      if(e.flurryT<=0&&e.flurryN>0){ e.flurryN--; e.flurryT=0.22;
        foeArc(e,tgt,26,2.4,e.atk*a.mul*0.7); }
      if(e.flurryN<=0&&e.stateT<=0){ e.state='recover'; e.stateT=0.6; } }
    else{ // chase / wander
      if(e.aggroT>0){
        e.state='chase'; e.ang=Math.atan2(dy,dx);
        let mx=0,my=0;
        if(a.keep){ const [lo,hi]=a.keep;
          if(dist>hi){mx=dx/dist;my=dy/dist;} else if(dist<lo){mx=-dx/dist;my=-dy/dist;}
          else { const pa=Math.atan2(dy,dx)+Math.PI/2; mx=Math.cos(pa)*0.6; my=Math.sin(pa)*0.6; } }
        else if(dist>a.range*0.8){ mx=dx/dist; my=dy/dist; }
        if(a.erratic&&Math.random()<0.06){ const ra=Math.random()*6.28; mx=Math.cos(ra); my=Math.sin(ra); }

function foeArc(e,tgt,range,arcHalf,dmg){ // enemy melee arc vs party

    case 'kingsweep': bossPattern(e,tgt,'king'); break;
    case 'boss': bossPattern(e,tgt,e.type); break;
  }
}
function spawnFoe(type,x,y){

function scaleFoe(type,depth){

function giantFor(depth){
  const cyc=Math.floor((depth-4)/12), base=[4,8,12].map(d=>d+Math.floor((depth-4)/12)*12);
  const ds=[4,8,12].find(d=>depth===d+cyc*12);
  const key=ds||[4,8,12][(depth/4)%3|0];
  const g=GIANTS[key], mult=1+0.5*cyc+(depth>12?0.18*(depth-12):0);
  return {type:g.type,name:g.name,title:g.title,hp:Math.round(g.hp*mult),atk:Math.round(g.atk*(1+0.1*(depth-4))),
    def:g.def+cyc*2,xp:Math.round(g.xp*mult),gold:[Math.round(g.gold[0]*mult),Math.round(g.gold[1]*mult)],
    spr:g.spr,pal:g.pal,w:g.w,h:g.h,blood:g.blood,bloodDark:g.bloodDark};
}

function bossPattern(e,tgt,type){

      dmgNum(e.x,e.y-e.h-10,'SHEDDING','#ff9a3a');

      spawnAoE(tgt.x,tgt.y,44,0.6,atk*1.4,true,'#ff5a1a',0); AU.slam(); }
    e.state='recover'; e.stateT=enraged?1.2:2.0;

    if(r<0.4){ // rend: dash at weakest

      e.state='recover'; e.stateT=1.4;
    } else { // devour: huge telegraphed bite
      e.tele=null; foeArc(e,weak,64,1.1,atk*2.2);
      blood(weak.x,weak.y-10,16,'#a02020',110); shake(0.4,6); AU.chomp();
      dmgNum(e.x,e.y-e.h-10,'DEVOUR','#ff3a2a');
      e.state='recover'; e.stateT=enraged?1.2:2.0; }
  } else if(type==='nul'){

    if(frac<0.5&&!e.phase2){ e.phase2=true;
      dmgNum(e.x,e.y-e.h-10,'SECOND HUNGER','#ff3a2a'); shake(0.6,7); AU.bossRoar();

      if(zone){ zone.teeth=[]; for(let i=0;i<10;i++){ const _a=i/10*6.283;
        zone.teeth.push({tx:((e.x+Math.cos(_a)*120)/16)|0,ty:((e.y+Math.sin(_a)*90)/16)|0,h:18+((i*37)%20)}); } }
      bossTaunt(e);
      e.state='recover'; e.stateT=1.4; return; }
    const r=Math.random();
    if(e.phase2){
      if(r<0.45){ // unmaking stars: staggered telegraphed starfall at the target
        teleBlast(tgt.x,tgt.y,54,0.9,atk*1.5,true);
        teleBlast(tgt.x+44,tgt.y-24,46,1.35,atk*1.3,true);

        fireProj(e.x,e.y-14,tgt.x,tgt.y,170,atk*1.4,true,'#b47aff',{silence:2,r:5}); AU.espit();
      } else { // event horizon: harder pull + drain
        ringFx(e.x,e.y-14,120,'rgba(120,60,180,0.9)'); AU.bind();
        for(const m of activeParty()){ if(m.hp<=0)continue;
          const d=Math.hypot(m.x-e.x,m.y-e.y);
          if(d<130){ const dr=Math.min(m.mp,14); m.mp-=dr;
            const a2=Math.atan2(e.y-m.y,e.x-m.x); m.kbx=(m.kbx||0)+Math.cos(a2)*160; m.kby=(m.kby||0)+Math.sin(a2)*160;

    } else if(r<0.4){ // unmake: bolt + silence
      fireProj(e.x,e.y-14,tgt.x,tgt.y,150,atk*1.4,true,'#b47aff',{silence:2,r:5});
      AU.espit();
    } else if(r<0.65){ // hollow call
      if(enemies.filter(x=>!x.dead).length<11){ const s=spawnFoe('watcher',e.x+40,e.y);
        if(s) toast('NUL: \u201cTHE VOID PROVIDES.\u201d'); }
    } else { // event horizon: drain MP + pull
      ringFx(e.x,e.y-14,100,'rgba(120,60,180,0.8)'); AU.bind();
      for(const m of activeParty()){ if(m.hp<=0)continue;
        const d=Math.hypot(m.x-e.x,m.y-e.y);

          dmgNum(m.x,m.y-26,'DRAINED','#b47aff'); } }
      dmgNum(e.x,e.y-e.h-10,'EVENT HORIZON','#b47aff'); }
    e.state='recover'; e.stateT=enraged?1.3:2.1;
  }
}

const RAR_COL={common:'#9a9a9a',fine:'#6ab0ff',relic:'#c07aff'};
const ITEM_DEFS={
 ember_potion:{name:'Ember Philter',kind:'consum',desc:'restores 45% HP'},
 soul_salve:{name:'Soul Salve',kind:'consum',desc:'restores 60% MP'},
 cinder_bomb:{name:'Cinder Bomb',kind:'consum',desc:'40+8/depth fire damage'},
 wraithbane:{name:'Wraithbane',kind:'consum',desc:'cleanse + drain ward'},

};
function addItem(it,qty){ qty=qty||1;
  if(typeof it==='string'){ const _id=it; it={id:_id,qty:0}; Object.assign(it,ITEM_DEFS[_id]); }
  const ex=it.kind==='consum'&&player.inv.find(i=>i.id===it.id);
  if(ex) ex.qty+=qty;
  else { it.qty=qty; player.inv.push(it); }
  return it; }
function removeItem(it,qty){ qty=qty||1; it.qty-=qty;
  if(it.qty<=0) player.inv.splice(player.inv.indexOf(it),1); }
const LOOT_PRE={1:['Embered','Ashen','Cinder'],2:['Embered','Wraithweave','Pyre','Barrow'],
 3:['Grave','Pyre','Wraithweave','Blood'],4:['Void','Starless','Maw','Tithe']};
const LOOT_BASE={weapon:['Brand','Blade','Fang','Edge'],garb:['Garb','Mantle','Shroud','Hide'],charm:['Charm','Fetish','Eye','Knot']};
function descFor(slot,mods,trait){
  const p=[]; if(mods.atk)p.push('+'+mods.atk+' ATK'); if(mods.def)p.push('+'+mods.def+' DEF');
  if(mods.mhp)p.push('+'+mods.mhp+' HP'); if(mods.mmp)p.push('+'+mods.mmp+' MP');
  if(trait==='burn_on_hit')p.push('burn on hit'); if(trait==='drain_ward')p.push('drain ward');
  if(trait==='xp_boost')p.push('+15% XP');
  if(mods.lightR)p.push('+'+mods.lightR+' light'); if(mods.clarity)p.push('+'+Math.round(mods.clarity*100)+'% clarity');
  if(mods.burnDmg)p.push('+'+Math.round(mods.burnDmg*100)+'% burn dmg'); if(mods.goldFind)p.push('+'+Math.round(mods.goldFind*100)+'% gold');
  return p.join(', ')||'a trinket'; }
function genLoot(depth,forceRar,forceSlot){
  const R=Math.random();
  let rarity=forceRar||(R<0.58?'common':R<0.87?'fine':'relic');
  const slots=['weapon','garb','charm'];
  let slot=forceSlot;
  if(!slot) slot=Math.random()<0.18?'lantern':slots[(Math.random()*3)|0]; // LANTERN: ~18% of drops
  if(slot==='lantern') return genLantern(depth,null,forceRar); // boss chests: genLoot(d,'relic','lantern')
  const tier=Math.min(4,1+((depth/3)|0));
  const pre=LOOT_PRE[tier][(Math.random()*LOOT_PRE[tier].length)|0];
  const base=LOOT_BASE[slot][(Math.random()*LOOT_BASE[slot].length)|0];
  const mult=rarity==='common'?1:rarity==='fine'?1.8:3;
  const mods={};
  if(slot==='weapon') mods.atk=Math.max(1,Math.round((2+depth*0.9)*mult));
  if(slot==='garb'){ mods.def=Math.max(1,Math.round((1+depth*0.55)*mult));
    if(rarity!=='common') mods.mhp=Math.round(depth*3*mult); }
  if(slot==='charm'){ if(Math.random()<0.5) mods.atk=Math.max(1,Math.round(depth*0.5*mult));
    else mods.mmp=Math.round(depth*2.2*mult); }
  const straits=['burn_on_hit','drain_ward','xp_boost'];
  const trait=rarity==='relic'?straits[(Math.random()*straits.length)|0]:null;
  return {id:'l'+Date.now()+((Math.random()*1e6)|0),name:pre+' '+base,kind:'equip',slot,
    mods,rarity,trait,desc:descFor(slot,mods,trait),val:Math.round(12*mult+depth*6),qty:1};
}
function rollLoot(e){
  const ch=e.boss?1:e.elite?0.35:0.1;
  if(Math.random()<ch){ const _nl=e.depth>=10&&(e.boss||e.elite)&&Math.random()<0.3; // ENDGAME-CONTENT 2026-10-07: named loot
    const it=_nl?genNamed(e.depth||1):genLoot(e.depth||1,e.boss?'relic':null);
    spawnPickup(e.x,e.y,'loot',0,it); }
  // trophies ("remains")
  const d=FOES[e.type];
  if(d.trophy){ const n=e.boss?10:e.elite?3:1;
    player.trophies[d.trophy]=(player.trophies[d.trophy]||0)+n; }
}
/* ================= LANTERN GEAR (2026-10-07) — carried light as an equipment stat ================
   4th equip slot (player only). Light radius + clarity (darkness alpha) from gear. Sources:
   world drops (~18% of loot), Fenn's shop (2 rotating), boss chests: genLoot(d,'relic','lantern') or genLantern(d,tier). */
const LANTERN_TIERS=[
 {name:'Tallow Stub',   light:18, clarity:0.04, flavor:'a candle pretending it matters.'},
 {name:'Oil Lantern',   light:34, clarity:0.08, flavor:'honest flame, honest work.'},
 {name:'Brass Beacon',  light:52, clarity:0.13, burnDmg:0.10, flavor:'the dark files a complaint.'},
 {name:"Saint's Cresset",light:68, clarity:0.19, burnDmg:0.20, goldFind:0.10, flavor:'blessed. probably. do not ask the saint.'},
 {name:'Dawnheart',     light:86, clarity:0.26, burnDmg:0.35, goldFind:0.25, flavor:'a sunrise that fits in your fist.'},
];
function lanternTierFor(depth){ return Math.min(5,1+(((depth-1)/2.4)|0)); } // d1→1 d4→2 d6→3 d9→4 d11+→5
function genLantern(depth,forceTier,forceRar){
  const tier=forceTier||lanternTierFor(depth), T=LANTERN_TIERS[tier-1];
  const R=Math.random(), rarity=forceRar||(R<0.55?'common':R<0.85?'fine':'relic');
  const mult=rarity==='common'?1:rarity==='fine'?1.15:1.3;
  const pre=LOOT_PRE[Math.min(4,1+((depth/3)|0))][(Math.random()*3)|0];
  const mods={lightR:Math.round(T.light*mult),clarity:Math.round(T.clarity*mult*100)/100};
  if(T.burnDmg) mods.burnDmg=Math.round(T.burnDmg*mult*100)/100;
  if(T.goldFind) mods.goldFind=Math.round(T.goldFind*mult*100)/100;
  return {id:'l'+Date.now()+((Math.random()*1e6)|0),name:pre+' '+T.name,kind:'equip',slot:'lantern',
    mods,rarity,lanternTier:tier,desc:descFor('lantern',mods,null)+' — '+T.flavor,
    val:Math.round(20*mult+depth*10+tier*15),qty:1};
}
function lanternLight(){ // {r: bonus light radius px, c: darkness alpha reduction}
  const it=player&&player.equip&&player.equip.lantern;
  if(!it||!it.mods) return {r:0,c:0};
  return {r:it.mods.lightR||0,c:Math.min(0.3,it.mods.clarity||0)};
}
function lanternBurnMul(){ const it=player&&player.equip&&player.equip.lantern; return 1+((it&&it.mods&&it.mods.burnDmg)||0); }
function lanternGoldMul(){ const it=player&&player.equip&&player.equip.lantern; return 1+((it&&it.mods&&it.mods.goldFind)||0); }

function hasTrait(id){ return (player.traits||[]).includes(id); }
function traitSlots(){ return player.camp.niche?3:2; }
function traitHookKill(e){
  if(hasTrait('grave_chain')){ let n=0;
    for(const o of enemies){ if(o.dead||o===e) continue;
      if(Math.hypot(o.x-e.x,o.y-e.y)<70&&n<2){ n++;
        damageFoe(o,effAtk()*0.8,{by:player}); sparks(o.x,o.y-8,6,'#9adfff'); } }
    if(n) dmgNum(e.x,e.y-20,'CHAIN','#9adfff'); }
  if(hasTrait('gravebloom')&&e.burnT>0){
    for(const o of enemies){ if(o.dead||o===e) continue;
      if(Math.hypot(o.x-e.x,o.y-e.y)<46) damageFoe(o,effAtk()*0.9,{burn:2}); }
    ringFx(e.x,e.y-8,40,'rgba(255,120,50,0.8)'); }
}
function traitHookDodge(){
  if(hasTrait('ember_oil')){
    spawnAoE(player.x,player.y-8,20,2.5,effAtk()*0.4,false,'#ff6a2a',2); }
}

const CAMP_UPS={
 stone:{name:'Hallowed Stone',cost:{gold:200},desc:'shrine heals fully'},
 fenn:{name:"Fenn's Contract",cost:{gold:150,bone:5},desc:'+ stock, better wares'},
 bench:{name:'Cinder Bench',cost:{gold:250,bone:8},desc:'unlock crafting'},
 tithe:{name:'Pale Tithe',cost:{gold:300,ichor:5},desc:'revive costs halved'},
 niche:{name:'Relic Niche',cost:{gold:400,ichor:8,starmetal:3},desc:'+1 trait slot'},
};
function campCostMet(id){ const c=CAMP_UPS[id].cost;
  if((player.gold||0)<(c.gold||0)) return false;
  for(const k of ['bone','ichor','starmetal','cinder'])
    if((player.trophies[k]||0)<(c[k]||0)) return false;
  return true; }
function buyCampUp(id){ const c=CAMP_UPS[id].cost;
  player.gold-=c.gold||0;
  for(const k of ['bone','ichor','starmetal','cinder']) player.trophies[k]-=c[k]||0;
  player.camp[id]=true; saveGame(); }
/* ---- crafting ---- */
const RECIPES=[
 {out:'ember_potion',n:2,cost:{cinder:4}},
 {out:'soul_salve',n:2,cost:{cinder:3,ichor:2}},
 {out:'cinder_bomb',n:3,cost:{cinder:5,bone:2}},
 {out:'wraithbane',n:1,cost:{ichor:4}},
 {out:'emberheart',n:1,cost:{ichor:6,bone:4}},
 {trait:'ember_oil',cost:{cinder:8,ichor:4}},
 {trait:'grave_chain',cost:{bone:6,ichor:6}},
 {equipSlot:'weapon',rar:'fine',cost:{cinder:10,bone:6}},
 {trait:'soul_magnet',cost:{starmetal:6}},
 {trait:'second_heart',cost:{ichor:8,starmetal:6}},
];
function recipeMet(r){ for(const k in r.cost) if((player.trophies[k]||0)<r.cost[k]) return false; return true; }
function craft(r){
  for(const k in r.cost) player.trophies[k]-=r.cost[k];
  if(r.out) addItem(r.out,r.n);
  else if(r.trait) addItem({id:'tr_'+r.trait,name:TRAITS[r.trait].name,kind:'trait',trait:r.trait,
    desc:TRAITS[r.trait].desc,rarity:'relic',val:120,qty:1});
  else if(r.equipSlot){ const it=genLoot(player.depth,r.rar,r.equipSlot); addItem(it); toast('Forged: '+it.name); }
  AU.pickup(); saveGame(); }
function salvage(it){
  const mult=it.rarity==='common'?1:it.rarity==='fine'?2:3;
  player.trophies.cinder=(player.trophies.cinder||0)+2*mult;
  player.trophies.bone=(player.trophies.bone||0)+mult;
  if(it.rarity!=='common') player.trophies.ichor=(player.trophies.ichor||0)+mult;
  removeItem(it,1); toast('Salvaged.'); AU.pickup(); saveGame(); }

        renderInv(); saveGame(); }]]);

    if(it.kind==='trait'){ if(!player.traits.includes(it.trait)&&player.traits.length<traitSlots())
      btns.push(['ATTUNE',()=>{ player.traits.push(it.trait); removeItem(it,1); renderInv(); saveGame(); toast('Trait attuned: '+TRAITS[it.trait].name); }]); }
    if(it.kind==='consum') btns.push(['USE',()=>{ useConsumable(it,m); renderInv(); }]);
    if(it.kind==='equip') btns.push(['SALVAGE',()=>{ salvage(it); renderInv(); }]);
    btns.push(['DROP',()=>{ removeItem(it,1); renderInv(); saveGame(); }]);
    row(nm,it.desc||'',btns);
  }
  h('REMAINS');
  row('Bone ×'+player.trophies.bone+' · Ichor ×'+player.trophies.ichor+' · Starmetal ×'+player.trophies.starmetal+' · Cinder ×'+player.trophies.cinder,

}
function equipOn(m,it){
  const old=m.equip[it.slot];
  m.equip[it.slot]=it; removeItem(it,1);
  if(old) player.inv.push(old);
  applyEquipStats(m); renderInv(); saveGame(); AU.pickup();
}
function applyEquipStats(m){
  let mhp=0,mmp=0;
  for(const s of ['weapon','garb','charm']){ const it=m.equip[s];
    if(it&&it.mods){ mhp+=it.mods.mhp||0; mmp+=it.mods.mmp||0; } }
  // rescale current hp/mp proportionally when max changes
  if(m._ebHp===undefined){ m._ebHp=0; m._ebMp=0; }
  const dhp=mhp-m._ebHp, dmp=mmp-m._ebMp;
  m.maxhp+=dhp; m.maxmp+=dmp; m.hp=Math.min(m.maxhp,m.hp+Math.max(0,dhp)); m.mp=Math.min(m.maxmp,m.mp+Math.max(0,dmp));
  m._ebHp=mhp; m._ebMp=mmp;
}
function useConsumable(it,m){
  if(it.id==='ember_potion'){ const h=Math.floor(m.maxhp*0.45);
    m.hp=Math.min(m.maxhp,m.hp+h); dmgNum(m.x,m.y-26,'+'+h,'#7ae08a'); }
  else if(it.id==='soul_salve'){ const r=Math.floor(m.maxmp*0.6);
    m.mp=Math.min(m.maxmp,m.mp+r); dmgNum(m.x,m.y-26,'+'+r+' MP','#9adfff'); }
  else if(it.id==='cinder_bomb'){ const tgt=nearestFoeTo(m.x,m.y,95);
    if(!tgt){ toast('No foe in reach.'); return; }
    const dmg=40+8*player.depth;
    fireProj(m.x,m.y-8,tgt.x,tgt.y,240,dmg,false,'#ff6a2a',{r:4});
    setTimeout(()=>{},0); toast('Bomb away!'); }
  else if(it.id==='wraithbane'){ m.burnT=0; m.atkDown=0; if(m===player)player.silenceT=0;
    m.drainWardT=60; toast('Cleansed and warded.'); }
  else if(it.id==='emberheart'){ const f=party.find(c=>c.recruited&&c.active&&!c.alive);
    if(!f){ toast('No one to revive.'); return; }
    f.alive=true; f.hp=Math.floor(f.maxhp*0.5); toast(f.name+' rises again.'); }
  removeItem(it,1); AU.heal(); saveGame();
}

let shopStock=null;
const FENN_QUIPS=[
 'Sold! A pleasure doing business with the soon-to-be-dead.',
 'Excellent choice. No refunds. Ever. Do not ask.',
 'You drive a hard bargain. Mostly because you look like you will stab me.',
 'Pleasure! Come back richer. Or deader. Either way, I profit.',
 'A fine purchase. Tell your friends. Actually, do not — I hate your friends.',
 'Gold in my pocket, junk in yours. Everybody wins. Mostly me.',
];
const FENN_SELL=[
 'I will give you forty percent and like it. ...Fine. Do not like it. Gold is gold.',
 'Sold to the smelly one in the back! Oh. That is you.',
 'A bold sale. A terrible price. My favorite kind.',
];
function fennStock(){
  const d=player.depth, R=mulberry32(seedBase+d*31);
  const stock={buy:[],sell:[]};
  const cons=[['ember_potion',25],['soul_salve',20],['cinder_bomb',30],['wraithbane',35],['emberheart',80]];
  for(const [id,base] of cons) stock.buy.push({kind:'consum',id,price:Math.round(base*(1+0.15*(d-1)))});
  const nEq=player.camp.fenn?5:3;
  for(let i=0;i<nEq;i++){ const it=genLoot(d,player.camp.fenn&&R()<0.4?'fine':null);
    it.price=Math.round(it.val*2.2*(1+0.15*(d-1))); stock.buy.push({kind:'equip',item:it,price:it.price}); }
  for(let i=0;i<2;i++){ const it=genLantern(d); // LANTERN: Fenn always stocks 2, rotating tiers
    it.price=Math.round(it.val*2.2*(1+0.15*(d-1))); stock.buy.push({kind:'equip',item:it,price:it.price}); }
  if(R()<0.5||player.camp.fenn){ const tk=Object.keys(TRAITS)[Math.floor(R()*Object.keys(TRAITS).length)];
    stock.buy.push({kind:'trait',trait:tk,price:Math.round(150*(1+0.2*(d-1)))}); }
  const fdisc=1-(player.fennDisc||0); // QUESTS: SUPPLY AND DEMAND discount
  if(fdisc<1) for(const s of stock.buy) s.price=Math.max(1,Math.round(s.price*fdisc));
  return stock;
}
function openShop(){ shopStock=fennStock(); renderShop(); setState('shop'); AU.ui(); }
function renderShop(){
  document.getElementById('shopGold').innerHTML='<span style="color:#c9a86a">'+player.gold+'g</span>';
  const buy=document.getElementById('shopBuy'); buy.innerHTML='';
  for(const s of shopStock.buy){
    const d=document.createElement('div'); d.className='itrow';
    let nm,desc;
    if(s.kind==='consum'){ nm=ITEM_DEFS[s.id].name; desc=ITEM_DEFS[s.id].desc; }
    else if(s.kind==='equip'){ nm='<span style="color:'+RAR_COL[s.item.rarity]+'">'+s.item.name+'</span>'; desc=s.item.desc; }
    else { nm='<span style="color:#c07aff">'+TRAITS[s.trait].name+'</span>'; desc=TRAITS[s.trait].desc; }
    d.innerHTML='<div class="nm">'+nm+'<span class="ds">'+desc+'</span></div>';
    const b=document.createElement('button'); b.className='mini'; b.textContent=s.price+'g';
    b.onclick=()=>{ if(player.gold<s.price){ toast('Fenn: \u201cWhoa whoa — this ain\u2019t charity, hero. Come back with actual money.\u201d'); return; }
      player.gold-=s.price;
      if(s.kind==='consum') addItem(s.id,1);
      else if(s.kind==='equip') addItem(s.item);
      else addItem({id:'tr_'+s.trait,name:TRAITS[s.trait].name,kind:'trait',trait:s.trait,desc:TRAITS[s.trait].desc,rarity:'relic',val:120,qty:1});
      shopStock.buy.splice(shopStock.buy.indexOf(s),1);
      AU.pickup(); toast('Fenn: \u201c'+FENN_QUIPS[(Math.random()*FENN_QUIPS.length)|0]+'\u201d'); renderShop(); saveGame(); };
    d.appendChild(b); buy.appendChild(d);
  }
  const sell=document.getElementById('shopSell'); sell.innerHTML='';
  const sellables=player.inv.filter(i=>i.kind==='equip'||i.kind==='trait');
  if(!sellables.length){ sell.innerHTML='<div class="itrow"><div class="nm" style="color:#5a5048">nothing to sell</div></div>'; }
  for(const it of sellables.slice()){
    const d=document.createElement('div'); d.className='itrow';
    const price=Math.max(1,Math.round((it.val||10)*0.4));
    d.innerHTML='<div class="nm"><span style="color:'+(RAR_COL[it.rarity]||'#9a9a9a')+'">'+it.name+'</span></div>';
    const b=document.createElement('button'); b.className='mini'; b.textContent='+'+price+'g';
    b.onclick=()=>{ player.gold+=price; removeItem(it,1); AU.pickup(); toast('Fenn: \u201c'+FENN_SELL[(Math.random()*FENN_SELL.length)|0]+'\u201d'); renderShop(); saveGame(); };
    d.appendChild(b); sell.appendChild(d);
  }
}

/* ================= SOFT DEATH ================= */
function softDeathRespawn(){
  const lost=Math.floor(player.gold*0.2);
  player.gold-=lost;
  // respawn at last shrine (checkpoint = current zone shrine; lair door if no shrine)
  const sh=zone?(zone.shrine||zone.entry):{tx:19,ty:25}; // LAIR 2026-10-07: lairs respawn at the sealed door
  player.x=(sh.tx+.5)*16; player.y=(sh.ty+.5)*16;
  player.hp=player.maxhp; player.mp=player.maxmp;
  player.burnT=0; player.silenceT=0; player.slowT=0; player.atkDown=0;
  player.combo=0; player.atkCd=0; player.dodgeT=0; player.iframes=0;
  // companions revive at half, enemies de-aggro
  for(const m of party){ if(m.recruited){ m.alive=true; m.hp=Math.max(1,Math.floor(m.maxhp*0.5));
    m.mp=m.maxmp; m.x=player.x; m.y=player.y+14; } }
  for(const e of enemies){ if(!e.dead){ e.aggroT=0; e.state='wander'; e.tele=null;
    e.hp=e.maxhp; e.x=e.sx; e.y=e.sy; } }
  trail.length=0;
  updateCamera(player.x,player.y);
  saveGame();
  say('The Wastes Take Their Tithe',
    (zone&&zone.lair)
      ?('Darkness closes over you — and spits you back at the sealed lair door, '+lost+' gold lighter and feeling like warmed-over shit. The boss is still in there. It is still pissed. Go finish it.')
      :('Darkness closes over you — and then, impossibly, the shrine-light. You wake kneeling on cold stone, '+
        lost+' gold lighter and feeling like warmed-over shit. The wastes keep what they catch. Everything else, you keep.'),
    ()=>{ toast('The wastes took their tithe: -'+lost+'g'); });
  AU.defeat(); AU.battleOn=false; AU.playTrack('explore');
}
function respawnAtShrine(){ softDeathRespawn(); }

// ---- chiptune music engine: 16th-note step sequencer, all melodies original ----
// note data as [midi, lenSteps] events (0 = rest); drums as 16-char bar patterns
// k=kick s=snare h=hat c=crash .=rest
function _mf(m){ return 440*Math.pow(2,(m-69)/12); }
// metal gallop: n beats of 8th+16th+16th chug on root r
const _gal=(r,n)=>{ const a=[]; for(let i=0;i<n;i++) a.push([r,2],[r,1],[r,1]); return a; };

      const s=95*dt/d; c.x+=dx*s; c.y+=dy*s; c.flip=dx<0; c.moving=true;
      c.ph+=dt*14;
      if(solidAt(c.x,c.y)){ c.x-=dx*s; c.y-=dy*s; }
      continue;
    }
    if(d>460){ c.on=false; continue; } // strayed too far: recycle
    if(c.pause>0){ c.pause-=dt; c.moving=false; }
    else{
      if(c.dart<=0){ // pick a new dart
        const a=Math.random()*Math.PI*2, sp=[46,38,30,34][c.type];
        c.vx=Math.cos(a)*sp; c.vy=Math.sin(a)*sp; c.dart=0.2+Math.random()*0.3;
        c.flip=c.vx<0;
      }
      c.dart-=dt; c.moving=true;
      const nx=c.x+c.vx*dt, ny=c.y+c.vy*dt;
      if(!solidAt(nx,ny)){ c.x=nx; c.y=ny; }
      else{ c.dart=0; c.pause=0.2+Math.random()*0.6; c.moving=false; }
      c.ph+=dt*12;
      if(c.dart<=0){ c.pause=0.3+Math.random()*0.9; c.moving=false; }
    }
  }
  if(on<target){ // top up toward target density; some drop from above
    let placed=0;
    for(const c of critters){
      if(placed>=2) break;
      if(!c.on){ critSpawn(c,Math.random()<0.3); if(c.on) placed++; }
    }
  }
  if(window.__ash){ const s0=critters.find(c=>c.on);
    window.__ash.critters={on:critters.reduce((n,c)=>n+(c.on?1:0),0),target,depth:player.depth,
      sample:s0?{x:Math.round(s0.x),y:Math.round(s0.y),type:s0.type}:null}; }
}
function drawCritters(){
  for(const c of critters){
    if(!c.on) continue;
    const sx=c.x-cam.x, sy=c.y-cam.y;
    if(sx<-12||sy<-12||sx>W+12||sy>H+12) continue;
    const fr=c.moving?((c.ph|0)%2):0;
    drawSprS(ctx,CRIT_SPR[c.type][fr],CRIT_PAL,Math.round(sx)-4,Math.round(sy)-2,1,c.flip);
  }
}

    else if(o.k==='foe'){ const e=o.e, d=FOES[e.type], b=Math.sin(e.bob)*1.5;

  const ex=[];

    if(sh) ex.push({x:(sh.tx+.5)*16-cam.x,y:(sh.ty+.5)*16-cam.y,r:46,a:0.5}); // LAIR 2026-10-07: shrine may be null
    if(zone.stair) ex.push({x:(zone.stair.tx+.5)*16-cam.x,y:(zone.stair.ty+.5)*16-cam.y,r:34,a:0.5});
    if(zone.merch) ex.push({x:(zone.merch.tx+.5)*16-cam.x,y:(zone.merch.ty+.5)*16-cam.y,r:30,a:0.45});

    for(const tc of (zone.torches||[])) if(tc.lit){ // TORCH: persistent light pools
      const fl=3*Math.sin(t*11+tc.tx*2.7)+1.5*Math.sin(t*23+tc.ty);
      ex.push({x:(tc.tx+.5)*16-cam.x,y:(tc.ty+.5)*16-cam.y-10,
        r:(tc.kind==='brazier'?66:tc.kind==='candelabra'?60:52)+fl,a:0.62}); } // GOTHIC: candelabra light
    if(daybreakT>0) ex.push({x:W/2,y:H/2,r:Math.max(W,H)*1.3,a:0.6}); // TORCH: all-lit reveal
  }
  renderLight(player.x-cam.x,player.y-cam.y-8,t,ex);
  drawHUD();
  drawBossBar(t);

/* ================= MINIMAP (2026-10-07) =================
   In-canvas minimap (NOT a DOM element — avoids all button-layout collisions).
   NICHOLAS DIRECTIVE 2026-10-07: the minimap is NEVER minimalized, shrunk, or
   hidden by any UI mode — it renders at full fixed MM_SIZE always. The ONLY
   controls are its own dedicated settings: SET.map (on/off) and SET.mapPos
   (corner preset). Any future UI-mode scaling signal must be ignored here. */
const MM_SIZE=76; // fixed — do not scale, do not derive from anything else
let mmExp=null, mmDirty=true, mmNext=0;
const mmCache=document.createElement('canvas'); mmCache.width=mmCache.height=MM_SIZE;
function mmReset(){ mmExp=new Uint8Array(MW*MH); mmDirty=true; mmReveal(player.x,player.y,8); }
function mmReveal(px,py,r){
  if(!mmExp) return;
  const cx=(px/16)|0, cy=(py/16)|0; let ch=false;
  for(let y=Math.max(0,cy-r);y<=Math.min(MH-1,cy+r);y++)
    for(let x=Math.max(0,cx-r);x<=Math.min(MW-1,cx+r);x++){
      if((x-cx)*(x-cx)+(y-cy)*(y-cy)>r*r) continue;
      const i=y*MW+x; if(!mmExp[i]){ mmExp[i]=1; ch=true; } }
  if(ch) mmDirty=true;
}
function tickExplore(){ mmReveal(player.x,player.y,8); } // fog-of-war reveal around player
function mmTileSize(){ return Math.min(70/MW,70/MH); }
function mmRenderCache(){
  const g=mmCache.getContext('2d');
  g.clearRect(0,0,MM_SIZE,MM_SIZE);
  const s=mmTileSize(), ox=(MM_SIZE-MW*s)/2, oy=(MM_SIZE-MH*s)/2;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(!mmExp[y*MW+x]) continue; // unexplored renders black (fog of war)
    const tl=MAP[y][x]; let c;
    if(tl==='#'||tl==='W') c='#7a7a86';      // wall — lighter
    else if(tl==='D') c='#e8b83a';            // door — gold
    else if(tl==='>') c='#ffd76a';            // stairs — bright gold
    else if(tl==='S') c='#cfd8e8';            // shrine — pale
    else if(tl==='M') c='#6ae86a';            // Fenn — green
    else if(tl==='B') c='#e07a3a';            // brazier — orange
    else if(tl==='R') c='#8ad8e8';            // recruit — pale blue
    else c='#3a3a44';                         // floor — dark gray
    g.fillStyle=c; g.fillRect(ox+x*s,oy+y*s,Math.ceil(s),Math.ceil(s));
  }
  const dot=(tx,ty,c,r)=>{ g.fillStyle=c; g.beginPath();
    g.arc(ox+(tx+.5)*s,oy+(ty+.5)*s,r||Math.max(1,s*0.4),0,7); g.fill(); };
  if(zone){
    for(const n of zone.notes) if(mmExp[n.ty*MW+n.tx]) dot(n.tx,n.ty,'#9ad0e8');
    for(const sp of zone.spirits) if(mmExp[sp.ty*MW+sp.tx]) dot(sp.tx,sp.ty,'#9ad0e8');
    for(const tc of (zone.torches||[])) if(mmExp[tc.ty*MW+tc.tx]) dot(tc.tx,tc.ty,tc.lit?'#ffb84a':'#7a5a3a');
  }
  mmDirty=false;
}
function mmPos(){ // corner preset → draw offset; gold frame + margins consistent everywhere
  const m=4, p=SET.mapPos||'tr';
  if(p==='tl') return [m,68];                 // below HP/MP bars + companion bars
  if(p==='bl') return [m,H-MM_SIZE-20];       // above XP bar
  if(p==='br') return [W-MM_SIZE-m,H-MM_SIZE-m];
  return [W-MM_SIZE-m,36];                    // tr default — below gold/depth HUD
}
function drawMinimap(t){
  if(!SET.map) return; // dedicated toggle is the ONLY visibility control
  if(mmDirty||t>mmNext){ if(t>mmNext){ mmDirty=true; mmNext=t+2; } mmRenderCache(); }
  const mp=mmPos(), mx=mp[0], my=mp[1];
  ctx.fillStyle='rgba(4,4,8,0.72)'; ctx.fillRect(mx,my,MM_SIZE,MM_SIZE);
  ctx.drawImage(mmCache,mx,my);
  ctx.strokeStyle='#c9a86a'; ctx.lineWidth=1; ctx.strokeRect(mx+.5,my+.5,MM_SIZE-1,MM_SIZE-1);
  const s=mmTileSize(), ox=mx+(MM_SIZE-MW*s)/2, oy=my+(MM_SIZE-MH*s)/2;
  const dot=(wx,wy,c,r)=>{ const tx=(wx/16)|0, ty=(wy/16)|0;
    if(tx<0||ty<0||tx>=MW||ty>=MH||!mmExp[ty*MW+tx]) return;
    ctx.fillStyle=c; ctx.beginPath(); ctx.arc(ox+(tx+.5)*s,oy+(ty+.5)*s,r||Math.max(1.2,s*0.45),0,7); ctx.fill(); };
  for(const e of enemies){ if(e.dead) continue; dot(e.x,e.y,e.boss?'#ff3a3a':'#c86a6a',e.boss?3:undefined); }
  for(const m of party){ if(m.recruited&&m.active&&m.alive) dot(m.x,m.y,'#6a9ae8'); }
  const ptx=(player.x/16)|0, pty=(player.y/16)|0;
  if(mmExp[pty*MW+ptx]){
    const cx=ox+(ptx+.5)*s, cy=oy+(pty+.5)*s;
    const a={up:-Math.PI/2,down:Math.PI/2,left:Math.PI,right:0}[player.dir]||0;
    ctx.fillStyle='#ffd76a'; ctx.save(); ctx.translate(cx,cy); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(3.4,0); ctx.lineTo(-2.4,-2.6); ctx.lineTo(-2.4,2.6);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
}

function drawTitle(t){

  ctx.fillStyle='#060507';
  for(let i=0;i<7;i++){ const x=(i*31+t*2)%(W+20)-10;
    ctx.fillRect(x,220,4,90); ctx.fillRect(x-8,240,20,3); }
  tickEmbers(t*0+0.016); drawEmbers(); // gentle drift (dt approx)
  renderLight(W/2,H*0.62,t,[{x:W/2,y:H*0.62,r:120,a:0.75}]);
}

/* ================= MAIN LOOP ================= */
let lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  const t=ts/1000; let dt=Math.min(0.05,lastTs?(t-lastTs):0.016); lastTs=t;
  if(hitstopT>0){ hitstopT-=dt; dt=0; }
  else if(slowmoT>0){ slowmoT-=dt; dt*=0.25; }
  if(shakeT>0) shakeT-=dt; else shakeMag=0;
  if(state==='title'){ drawTitle(t); }
  else if(state==='map'){
    movePlayer(dt);
    tickEnemies(dt);
    for(const m of party) tickCompanion(m,dt);
    if(barkCd>0)barkCd-=dt;
    if(lairIntroCd>0){ lairIntroCd-=dt; // LAIR 2026-10-07: banner beat, then name + taunt + fight
      if(lairIntroCd<=0&&zone&&zone.lair){ const b=enemies.find(e=>e.boss&&!e.dead);
        if(b){ const L=zone.lair; say(L.name,L.line,()=>{ const b2=enemies.find(e=>e.boss&&!e.dead); if(b2) bossIntro(b2); }); } } }
    tickTrail(dt); tickTorches(dt); // TORCH
    updatePlayerCombat(dt);
    tickProjs(dt); tickAoes(dt); tickPickups(dt);
    tickMotes(dt); tickParts(dt); tickChunks(dt); tickDecals(dt); tickFloaters(dt); tickGorePlus(dt); tickCritters(dt);
    tickExplore(); // MINIMAP 2026-10-07: fog-of-war reveal around player
    updateCamera(player.x,player.y,dt); drawMap(t);
    if(consumeAction()) doInteract();
  }
  else if(state==='dialog'){ drawMap(t); if(consumeAction()) advanceDlg(); }
  else if(state==='choice'){ drawMap(t); }
  else if(state==='inv'||state==='shop'||state==='camp'){ drawMap(t); }
  else if(state==='pause'){ drawMap(t); } // PAUSE 2026-10-07: frozen frame, no tick
  input.actionEdge=false;
}
/* ================= PAUSE MENU + SETTINGS (2026-10-07) =================
   ⏸ button (top-center), pause overlay, settings persisted to localStorage.
   Pause freezes the sim (state='pause' draws a frozen frame, no tick) and
   suspends the music scheduler (AU._paused — _sched resyncs, no stuck notes). */
const SET=Object.assign({mus:80,sfx:80,shake:true,gore:true,dmgnum:true,muted:false,map:true,mapPos:'tr'},
  JSON.parse(localStorage.getItem('toodark_settings')||'{}'));
function saveSettings(){ try{ localStorage.setItem('toodark_settings',JSON.stringify(SET)); }catch(e){} }
let paused=false, pauseFrom='map', settingsOpen=false;
function applyVolumes(){ if(!AU.ctx) return; // live volume apply
  if(AU._mus.bus) AU._mus.bus.gain.value=0.5*(SET.mus/100);
  if(AU.sfx) AU.sfx.gain.value=0.9*(SET.sfx/100); }
function setPaused(p){
  if(p===paused) return;
  paused=p; AU._paused=p; // read by _sched: pauses scheduling, resyncs nextT on resume
  if(p){ pauseFrom=state; setState('pause');
    document.getElementById('pauseUI').classList.remove('hidden');
    document.getElementById('btnNG').style.display=player.ngReady?'':'none'; // ENDGAME-CONTENT 2026-10-07
  } else {
    document.getElementById('pauseUI').classList.add('hidden');
    closeSettings();
    setState(pauseFrom==='pause'?'map':pauseFrom);
  }
}
function buildSettings(){
  const rows=document.getElementById('setRows'); rows.innerHTML='';
  const mkRow=(label,el,valTxt)=>{ const d=document.createElement('div'); d.className='setRow';
    const s=document.createElement('span'); s.textContent=label;
    const v=document.createElement('span'); v.className='setVal'; v.textContent=valTxt;
    d.append(s,el,v); rows.appendChild(d); return v; };
  const slider=(label,key)=>{ const i=document.createElement('input'); i.type='range';
    i.min=0; i.max=100; i.value=SET[key];

/* ================= RANGED ATTACK (added 2026-10-07) =================
   RNG button fires an ash-bolt: cooldown-based (0.85s, no MP — consistent with
   melee being free), 0.75x effAtk, targets nearest foe in facing arc, else
   nearest foe, else blind-fires along facing. Kills flow through damageFoe ->
   killFoe, so barks/gore/XP all work. */
function tryRanged(){
  if(player.hp<=0||state!=='map') return;
  if((player.rngCd||0)>0) return;
  player.rngCd=0.85;
  const a=dirAngle(player.dir), px=player.x, py=player.y-8;
  let tgt=nearestFoeTo(px+Math.cos(a)*50,py+Math.sin(a)*50,230)||nearestFoeTo(px,py,230);
  const tx=tgt?tgt.x:px+Math.cos(a)*170, ty=tgt?tgt.y-6:py+Math.sin(a)*170;
  const dmg=Math.max(1,Math.round(effAtk()*0.75));
  fireProj(px,py,tx,ty,260,dmg,false,'#c9a86a',{r:3,tag:'ashbolt'});
  sparks(px+Math.cos(a)*10,py+Math.sin(a)*10,3,'#c9a86a');
  if(AU&&AU.volley) AU.volley();
}

/* ================= ABILITY CORRELATIONS / COMBO SYSTEM (added 2026-10-07) =================
   COMBO LIST — skills interacting. To add a new correlation:
   1. Document it below. 2. Hook it in the matching combo* function (or add one
      and call it from the skill/melee/projectile site with a // COMBO comment).
   CURRENT COMBOS (all original mechanics, using the game's real skills):
   1. MELTDOWN    — melee hit lands on a BURNING foe -> +40% dmg, always crits.
                     (burn sources: Ember Volley, Immolate, Cinder Combo finisher)
   2. FLASHOVER   — an Ember Volley bolt strikes an already-burning foe ->
                     40px AoE burst dealing 0.8x around the impact (0.8s per-foe cd).
   3. GRAVE DUES  — melee FINISHER on a stunned/staggered foe -> +75% dmg.
                     (stun sources: Gravebind; stagger: heavy hits)
   4. BACKSTAB    — nightblade Wraithstep (shadowT) consumed by a melee swing ->
                     guaranteed crit +50% dmg on every foe that swing hits.
   5. BLOOD TITHE — Soul Tithe drains burning foes -> heal +50% per burning foe
                     drained (max 3 counted).
   6. CINDERFALL  — Cinderstorm cast while standing inside your own Immolate
                     zone -> +50% dmg, +40px radius.
   FUTURE HOOKS: comboMeleeHit (melee), comboMeleeAfter (post-melee),
   comboProjHit (projectile impacts), comboThorns (damage taken). */
function comboPop(x,y,txt,color){ dmgNum(x,y,txt,color||'#ffd76a'); }
function comboMeleeHit(src,e,o,dm,crit){
  if(src!==player) return [dm,crit];
  const now=performance.now()/1000;
  if(e.burnT>0){ // 1. MELTDOWN
    dm*=1.4; crit=true;
    if(now-(e._meltT||0)>2){ e._meltT=now; comboPop(e.x,e.y-e.h-14,'MELTDOWN','#ff7a2a'); } }
  if(o.heavy&&(e.stunT>0||e.state==='stagger')){ // 3. GRAVE DUES
    dm*=1.75;
    if(now-(e._gdT||0)>2){ e._gdT=now; comboPop(e.x,e.y-e.h-14,'GRAVE DUES','#ffd76a'); } }
  if((src.shadowT||0)>0){ // 4. BACKSTAB (wraithstep consumed by this swing)
    dm*=1.5; crit=true;
    if(now-(src._bsT||0)>3){ src._bsT=now; comboPop(e.x,e.y-e.h-14,'BACKSTAB','#c9a86a'); } }
  return [dm,crit];
}
function comboMeleeAfter(src,e,dm){
  if(src===player&&(player.tal||{}).lifesteal){ // TALENT: Leeching Strikes
    player.hp=Math.min(player.maxhp,player.hp+Math.max(1,Math.round(dm*player.tal.lifesteal))); }
}
function comboProjHit(e,p){
  if(p.tag!=='ember_volley'||!(e.burnT>0)) return; // 2. FLASHOVER
  const now=performance.now()/1000;
  if(now-(e._flashT||0)<0.8) return; e._flashT=now;
  for(const o2 of enemies){ if(o2.dead||o2===e) continue;
    if(Math.hypot(o2.x-e.x,o2.y-e.y)<40) damageFoe(o2,p.dmg*0.8,{by:player}); }
  ringFx(e.x,e.y-8,34,'rgba(255,140,60,0.7)');
  comboPop(e.x,e.y-24,'FLASHOVER','#ff9a3a');
}
function comboThorns(m,dmg,sx,sy){
  if(m!==player||!((player.tal||{}).thorns)||sx===undefined) return; // TALENT: Barbed Hide
  const foe=nearestFoeTo(sx,sy,46);
  if(foe&&!foe.dead){ damageFoe(foe,Math.max(1,Math.round(dmg*player.tal.thorns)),{by:player});
    sparks(foe.x,foe.y-8,4,'#c9a86a'); }
}

function talentNodeById(id){ for(const b of ['iron','pyre','shroud']) for(const n of TALENTS[b]) if(n.id===id) return n; return null; }
function canTakeTalent(n){
  if((player.talents||[]).includes(n.id)) return 'taken';
  if((player.talentPts||0)<n.cost) return 'pts';
  if(n.req&&!(player.talents||[]).includes(n.req)) return 'req';
  return 'ok';
}
function spendTalent(id){
  const n=talentNodeById(id); if(!n||canTakeTalent(n)!=='ok') return;
  player.talentPts-=n.cost; player.talents.push(id);
  recalcTalents(); renderInv(); saveGame();
  if(AU&&AU.levelup) AU.levelup();
  toast('Talent: '+n.name);
}
function recalcTalents(){
  player.talents=player.talents||[]; player.talentPts=player.talentPts||0;
  const T=player.tal={meleeMul:0,spellMul:0,lifesteal:0,thorns:0,moveMul:0,critB:0,atkSpd:0,
    mpCost:0,burnDur:0,mpRegen:0,aoeMul:0,maxhpB:0,defB:0,dodgeMul:0,xpMul:0};
  for(const id of player.talents){ const n=talentNodeById(id); if(!n) continue;
    for(const k in n.fx){ if(k==='trait') continue; T[k]=(T[k]||0)+n.fx[k]; } }
  const dhp=(T.maxhpB||0)-(player._talHp||0); // apply max-HP delta once
  if(dhp!==0){ player.maxhp+=dhp; player.hp=Math.min(player.maxhp,Math.max(1,player.hp+Math.max(0,dhp))); player._talHp=T.maxhpB||0; }
  player.dodgeMul=Math.max(0.5,1-(T.dodgeMul||0)); // read by tryDodge
  for(const id of player.talents){ const n=talentNodeById(id); // trait grants
    if(n&&n.fx.trait&&!player.traits.includes(n.fx.trait)&&player.traits.length<traitSlots()){
      player.traits.push(n.fx.trait); toast('Trait gained: '+TRAITS[n.fx.trait].name); } }
}
function renderTalents(body,h,row){
  recalcTalents();
  h('TALENT POINTS: '+(player.talentPts||0));
  row('The ash remembers.','spend points earned from levels — take a node to unlock the next',[]);
  for(const b of ['iron','pyre','shroud']){
    const bb=TALENT_BRANCH[b]; h(bb[0]+' — '+bb[1]);
    for(const n of TALENTS[b]){
      const st=canTakeTalent(n);
      const nm=(st==='taken'?'<span style="color:#ffd76a">✓ ':'<span style="color:#e8dcc2">')+n.name+'</span>';
      const reqN=n.req?talentNodeById(n.req):null;
      const ds=n.desc+' · '+n.cost+' pt'+(n.cost>1?'s':'')+(reqN?' · needs '+reqN.name:'');
      const tag=st==='taken'?'':st==='pts'?' <span style="color:#5a5048">(need points)</span>':' <span style="color:#5a5048">(locked)</span>';
      row(nm+tag,ds,st==='ok'?[['SPEND '+n.cost,()=>spendTalent(n.id)]]:[]);
    }
  }
}

/* ================= QUESTS (added 2026-10-07) =================

const QSPIRIT_TARGETS=['hound','dreg','cultist','husk','wraith','mourn'];
function qDef(id){

    comp_issa:{name:"ISSA'S FURNACE",kind:'side',giver:'Issa',need:15,desc:'Issa wants 15 kills by spellfire. She is very specific about this.',unit:'spell kills'},
    comp_pell:{name:"PELL'S QUIET",kind:'side',giver:'Pell',need:3,desc:'Pell wants 3 chests opened. She said it with a nod. That counts as talking.',unit:'chests opened'},
  };
